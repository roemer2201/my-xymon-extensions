# Configuration used by the fritzwan.sh unit tests (tests/run.sh):
# utilization thresholds enabled so ~20% downstream trips the warning.

CURL="${FAKECURL:?FAKECURL must be exported by the test runner}"
FRITZ_HOST="fritz.box"
FRITZ_USER="monitor"
FRITZ_PASSWORD="secret"
REPORTHOST="fritzbox"

UTIL_WARN=15
UTIL_CRIT=90
