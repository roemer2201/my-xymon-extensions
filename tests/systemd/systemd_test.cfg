# Configuration used by the systemd.sh unit tests (tests/run.sh).
# Sourced by systemd.sh via SYSD_CFG. Pins the fake systemctl and the
# fake sd_booted(3) marker directory; everything else stays overridable
# through the environment (a value set here would win over it).

SYSD_SYSTEMCTL="${FAKESYSTEMCTL:?FAKESYSTEMCTL must be exported by the test runner}"
SYSD_RUNDIR="${FAKESYSD_RUNDIR:?FAKESYSD_RUNDIR must be exported by the test runner}"
