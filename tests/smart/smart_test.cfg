# Configuration used by the smart.sh unit tests (tests/run.sh).
# Sourced by smart.sh via SMART_CFG.

SMARTCTL="${FAKESMARTCTL:?FAKESMARTCTL must be exported by the test runner}"
USE_SUDO="no"

device /dev/tsda
device /dev/tssd
device /dev/tsdk
device /dev/tsdc
device /dev/tnvme0

# Exercise the per-model override: attribute 194 of this model reports
# garbage (77), so it is ignored and the temperature must come from
# 190 Airflow_Temperature_Cel (39).
attrmap "ST4000DM004*" 194 none
