# Configuration used by the smart.sh DWPD guard test (tests/run.sh).
# Same as smart_test.cfg, but DWPD_MIN_HOURS is raised above the highest
# power-on hours of any fixture (47708) so that the lifetime dwpd metric
# must be withheld for every device.

SMARTCTL="${FAKESMARTCTL:?FAKESMARTCTL must be exported by the test runner}"
USE_SUDO="no"

device /dev/tsda
device /dev/tssd
device /dev/tsdk
device /dev/tsdc
device /dev/tnvme0

MMC_UTILS="${FAKEMMC:?FAKEMMC must be exported by the test runner}"
MMC_DEVICES="/dev/tmmc0 /dev/tmmc1"

attrmap "ST4000DM004*" 194 none

DWPD_MIN_HOURS=50000
