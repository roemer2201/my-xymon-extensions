# Configuration for the "no smartctl, eMMC only" test run (tests/run.sh),
# the typical OpenWrt/TurrisOS router without smartmontools.
# Sourced by smart.sh via SMART_CFG.

SMARTCTL="/nonexistent/smartctl"
USE_SUDO="no"

MMC_UTILS="${FAKEMMC:?FAKEMMC must be exported by the test runner}"
MMC_DEVICES="/dev/tmmc0"
