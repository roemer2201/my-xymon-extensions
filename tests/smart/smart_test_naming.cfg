# Configuration for the device naming tests (tests/run.sh): serial
# naming, diskalias, a disk seen twice (multipath), a SAS disk with
# "Serial number:" and an eMMC serial from a fake sysfs tree.
# Sourced by smart.sh via SMART_CFG.

SMARTCTL="${FAKESMARTCTL:?FAKESMARTCTL must be exported by the test runner}"
USE_SUDO="no"
DEVICE_NAMING="${SMART_TEST_NAMING:-serial}"

device /dev/tssd
device /dev/tssd2
device /dev/tsas
device /dev/tnvme0

diskalias S5GXTEST bay3

MMC_UTILS="${FAKEMMC:?FAKEMMC must be exported by the test runner}"
MMC_DEVICES="/dev/tmmc0"
