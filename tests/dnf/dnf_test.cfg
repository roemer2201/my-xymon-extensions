# Configuration used by the dnf.sh unit tests (tests/run.sh).
# Sourced by dnf.sh via DNF_CFG. Only pins the fake binary, the fake
# cache directory and the os-release fixture; everything else stays
# overridable through the environment (a value set here would win over
# the environment).

DNF_BIN="${FAKEDNF:?FAKEDNF must be exported by the test runner}"
DNF_CACHEDIR="${FAKEDNF_CACHE:?FAKEDNF_CACHE must be exported by the test runner}"
DNF_OSRELEASE="${FAKEDNF_OSRELEASE:?FAKEDNF_OSRELEASE must be exported by the test runner}"
