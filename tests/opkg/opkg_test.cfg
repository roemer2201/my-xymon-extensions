# Configuration used by the opkg.sh unit tests (tests/run.sh).
# Sourced by opkg.sh via OPKG_CFG. Only pins the fake binary and the
# lists directory; everything else stays overridable through the
# environment (a value set here would win over the environment).

OPKG_BIN="${FAKEOPKG:?FAKEOPKG must be exported by the test runner}"
OPKG_LISTSDIR="${FAKEOPKG_LISTSDIR:?FAKEOPKG_LISTSDIR must be exported by the test runner}"
