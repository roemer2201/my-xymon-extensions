# Configuration used by the lxc.sh unit tests (tests/run.sh):
# no LXC on this host -> the extension must report "clear".
# (Pinned to a non-existent path instead of trusting "command -v",
# because the CI host might actually have the lxc tools installed.)

LXC_LS="/nonexistent/lxc-ls"
LXC_INFO="/nonexistent/lxc-info"
LXC_AUTOSTART="/nonexistent/lxc-autostart"
