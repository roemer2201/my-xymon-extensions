# Configuration used by the lxc.sh unit tests (tests/run.sh).
# Sourced by lxc.sh via LXC_CFG. Pins the fake tools and the fake
# sysfs/proc trees; everything else stays overridable through the
# environment (a value set here would win over the environment).

LXC_LS="${FAKELXC_LS:?FAKELXC_LS must be exported by the test runner}"
LXC_INFO="${FAKELXC_INFO:?FAKELXC_INFO must be exported by the test runner}"
LXC_AUTOSTART="${FAKELXC_AUTOSTART:?FAKELXC_AUTOSTART must be exported by the test runner}"
LXC_UCI_AUTO="${FAKELXC_UCI:?FAKELXC_UCI must be exported by the test runner}"
LXC_CGROUPFS="${FAKELXC_CGROUP:?FAKELXC_CGROUP must be exported by the test runner}"
LXC_PROC="${FAKELXC_PROC:?FAKELXC_PROC must be exported by the test runner}"
