# Configuration used by the fritzdsl.sh unit tests (tests/run.sh).
# Sourced by fritzdsl.sh via FRITZDSL_CFG.

CURL="${FAKECURL:?FAKECURL must be exported by the test runner}"
FRITZ_HOST="fritz.box"
FRITZ_USER="monitor"
FRITZ_PASSWORD="secret"
REPORTHOST="fritzbox"

# Low warn threshold so the CRC-rate test can trigger it with a
# 5-minute-old state file (56 errors / 5 min = 11.2/min).
CRC_RATE_WARN=10
CRC_RATE_CRIT=1000
