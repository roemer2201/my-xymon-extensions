name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: shellcheck + unit tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make test

  busybox:
    name: unit tests under BusyBox (OpenWrt-like)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BusyBox
        run: sudo apt-get update && sudo apt-get install -y busybox
      - name: Run unit tests with BusyBox sh and userland
        run: |
          mkdir -p /tmp/bb
          busybox --install -s /tmp/bb
          PATH="/tmp/bb:$PATH" TESTSH="busybox sh" busybox sh tests/run.sh

  deb:
    name: build .deb (Ubuntu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: make deb
      - name: Verify package contents
        run: dpkg-deb -I build/*.deb && dpkg-deb -c build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  deb-server:
    name: build server .deb (Ubuntu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: make deb-server
      - name: Verify package contents
        run: |
          dpkg-deb -I build/my-xymon-extensions-server_*.deb
          dpkg-deb -c build/my-xymon-extensions-server_*.deb
      - name: Both packages must be co-installable (shared /etc/xymon)
        run: |
          set -e
          make deb
          # xymon/xymon-client are not installed on the runner, so the
          # dependencies are forced - this checks the file layout, not
          # the dependency chain.
          sudo dpkg --force-depends -i \
            build/my-xymon-extensions_*.deb \
            build/my-xymon-extensions-server_*.deb
          dpkg -L my-xymon-extensions | sort > /tmp/client.list
          dpkg -L my-xymon-extensions-server | sort > /tmp/server.list
          # Directories are shared legitimately, files are not. Note the
          # "if" instead of "[ -f ] && echo": the shared entries end on a
          # directory, so the loop would exit non-zero and set -e would
          # kill the step before it ever got to the assertion.
          shared=$(comm -12 /tmp/client.list /tmp/server.list \
            | while read -r p; do if [ -f "$p" ]; then echo "$p"; fi; done)
          test -z "$shared" || { echo "both packages ship: $shared"; exit 1; }
          sudo dpkg --purge my-xymon-extensions-server my-xymon-extensions
      - uses: actions/upload-artifact@v4
        with:
          name: deb-server-package
          path: build/my-xymon-extensions-server_*.deb

  rpm:
    name: build .rpm (Rocky Linux)
    runs-on: ubuntu-latest
    needs: test
    container: rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: dnf install -y rpm-build make tar gzip
      - run: make rpm
      - name: Verify package contents
        run: rpm -qlp build/rpm/RPMS/noarch/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: build/rpm/RPMS/noarch/*.rpm

  opkg:
    name: build .ipk (OpenWrt/TurrisOS)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: make opkg
      - name: Verify package contents
        run: |
          tar -tzf build/opkg/out/*.ipk
          tar -xzOf build/opkg/out/*.ipk ./control.tar.gz | tar -tz
          tar -xzOf build/opkg/out/*.ipk ./data.tar.gz | tar -tz
      - uses: actions/upload-artifact@v4
        with:
          name: opkg-package
          path: build/opkg/out/*.ipk

