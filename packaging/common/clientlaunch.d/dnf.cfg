# Xymon task definition for the "dnf" extension (pending package
# updates, security advisories and stale repository metadata on
# dnf-based systems). Shipped by the my-xymon-extensions packages into
# the client's clientlaunch.d directory (or append to clientlaunch.cfg).
#
# The task ships DISABLED in the deb and FreeBSD packages: those hosts
# have no dnf, so the column would sit at "clear" forever. The rpm
# package removes the DISABLED line at build time and ships the task
# ENABLED - every EL host has dnf, and the extension needs no
# configuration, no root rights and no network access (it reads dnf's
# system cache, see my-xymon-extensions/dnf.cfg).
#
# Keep the interval at 5m if you want the graphs: Xymon's RRD files
# expect a value at least every 10 minutes. A longer interval also
# needs a longer DNF_LIFETIME in my-xymon-extensions/dnf.cfg.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; they have no dnf, so the extension is not
# in the default TESTS list in standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# dnf.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[dnf]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh dnf
    LOGFILE $XYMONCLIENTLOGS/dnf.log
    INTERVAL 5m
    DISABLED
