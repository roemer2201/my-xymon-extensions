# Xymon task definition for the "if_link" extension (network
# interface link state changes). Shipped by the my-xymon-extensions
# packages into the client's clientlaunch.d directory (or append to
# clientlaunch.cfg).
#
# The task ships ENABLED: the extension only reads /sys/class/net,
# which every Linux host has, and it stays green until thresholds are
# configured. On a server it watches the NICs (eno1, enp3s0, ...), on
# a router the individual switch ports. Platforms without those
# counters (FreeBSD) report a "clear" column - comment the block out
# there if you do not want it.
#
# Keep the interval stable: the metric is the number of link changes
# since the previous poll, so its scale depends on the poll interval.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; there the extension is part of the
# default TESTS list in standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# if_link.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[if_link]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh if_link
    LOGFILE $XYMONCLIENTLOGS/if_link.log
    INTERVAL 5m
