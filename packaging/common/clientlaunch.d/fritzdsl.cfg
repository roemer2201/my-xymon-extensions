# Xymon task definition for the "fritzdsl" extension (FRITZ!Box DSL
# line monitoring via TR-064). Shipped by the my-xymon-extensions
# packages into the client's clientlaunch.d directory (or append to
# clientlaunch.cfg).
#
# The task ships DISABLED: it needs FRITZ!Box credentials in
# fritzdsl.cfg first. Configure them on the polling host (normally
# the Xymon server), then remove the DISABLED line and restart the
# Xymon client.

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# fritzdsl.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[fritzdsl]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh fritzdsl
    LOGFILE $XYMONCLIENTLOGS/fritzdsl.log
    INTERVAL 5m
    DISABLED
