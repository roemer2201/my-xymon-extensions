# Xymon task definition for the "systemd" extension (systemd service
# manager health: system state, failed units, required units and
# automatic service restarts). Shipped by the my-xymon-extensions
# packages into the client's clientlaunch.d directory (or append to
# clientlaunch.cfg).
#
# The task ships ENABLED: every current Ubuntu and Rocky Linux host
# runs systemd, and the extension needs no configuration and no root
# rights. Hosts with another init system (FreeBSD) report a "clear"
# column - comment the block out there if you do not want it, or set
# SYSD_ENABLE="no" in my-xymon-extensions/systemd.cfg.
#
# Keep the interval stable: the "restarts" graph shows the restarts
# since the previous poll, so its scale depends on the poll interval.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; OpenWrt uses procd, not systemd, so the
# extension is not in the default TESTS list in standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# systemd.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[systemd]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh systemd
    LOGFILE $XYMONCLIENTLOGS/systemd.log
    INTERVAL 5m
