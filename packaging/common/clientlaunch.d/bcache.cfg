# Xymon task definition for the "bcache" extension (Linux bcache:
# cache sets, cache and backing devices, hit ratio, dirty data).
# Shipped by the my-xymon-extensions packages into the client's
# clientlaunch.d directory (or append to clientlaunch.cfg).
#
# DISABLED by default: most hosts have no bcache, and the column would
# sit at "clear" forever. Remove the comment markers below on a host
# with bcache devices - the extension reads sysfs only and needs no
# root rights and no configuration. If $XYMONTMP is a tmpfs, set
# BCACHE_STATEDIR in my-xymon-extensions/bcache.cfg (see there).
#
# Keep the interval stable: hit ratios, request rates and throughput
# are averages over the time since the previous poll.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; bcache is not in the default TESTS list in
# standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# bcache.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
#[bcache]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/xymonext.sh bcache
#    LOGFILE $XYMONCLIENTLOGS/bcache.log
#    INTERVAL 5m
