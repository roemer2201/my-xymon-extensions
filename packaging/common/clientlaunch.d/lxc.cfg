# Xymon task definition for the "lxc" extension (LXC container status
# and resource usage). Shipped by the my-xymon-extensions packages into
# the client's clientlaunch.d directory (or append to clientlaunch.cfg).
#
# DISABLED by default: most hosts running a full Xymon client have no
# LXC installed, and the column would sit at "clear" forever. Remove the
# comment markers below on an LXC host - the extension needs nothing but
# the lxc tools, and it reads them as the user the client runs as, so an
# unprivileged container of another user stays invisible.
#
# Keep the interval stable: cpu, netin and netout are averages over the
# time since the previous poll.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; there the extension is part of the default
# TESTS list in standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# lxc.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
#[lxc]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/xymonext.sh lxc
#    LOGFILE $XYMONCLIENTLOGS/lxc.log
#    INTERVAL 5m
