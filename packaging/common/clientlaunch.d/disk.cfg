# Xymon task definition for the "disk" extension (filesystem usage).
# Shipped by the my-xymon-extensions packages into the client's
# clientlaunch.d directory (or append to clientlaunch.cfg).
#
# DISABLED by default: a full Xymon client builds the "disk" column
# from its own df report, and this extension reports into exactly
# that column - enabling both on one host would have them overwrite
# each other. Change DISK_COLUMN in disk.cfg first if you really want
# it next to a full client.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; xymon-run.sh runs every installed
# extension via cron anyway.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# disk.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
#[disk]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/xymonext.sh disk
#    LOGFILE $XYMONCLIENTLOGS/disk.log
#    INTERVAL 5m
