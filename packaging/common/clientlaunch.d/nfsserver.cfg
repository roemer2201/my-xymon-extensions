# Enable this task on a Linux NFS server by removing the DISABLED line.
[nfsserver]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh nfsserver
    LOGFILE $XYMONCLIENTLOGS/nfsserver.log
    INTERVAL 5m
    DISABLED

# Only for kernels before 5.12 (Rocky 8): their nfsd byte counters are
# 32 bit and wrap at 4 GiB. This task samples them every second, counts
# the wraps, and nfsserver above then graphs the byte rates. It runs for
# as long as xymonlaunch does; INTERVAL only restarts it, at most once a
# minute, should it ever stop. No MAXTIME, and not through xymonext.sh,
# which measures single runs. Remove the DISABLED line to enable it.
[nfsserver-sampler]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/nfsserver-sampler.sh
    LOGFILE $XYMONCLIENTLOGS/nfsserver-sampler.log
    INTERVAL 1m
    DISABLED
