# Xymon task definition for the "claude" extension (validity of the
# Claude Code login). Shipped by the my-xymon-extensions packages into
# the client's clientlaunch.d directory (or append to clientlaunch.cfg).
#
# DISABLED by default for two reasons: most hosts have no Claude Code
# installed and the column would sit at "clear" forever, and the check
# needs one setup step anyway - the credentials file is mode 0600 in a
# private home directory, so the Xymon client needs a sudo rule for
# ext/claude-expiry.sh (see the shipped sudoers.example). Set that up,
# list the accounts in etc/my-xymon-extensions/claude.cfg, then remove
# the comment markers below.
#
# The interval stays well below Xymon's 30 minute status lifetime so
# the column never goes purple between two runs; the check itself is
# one small file read and costs nothing.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; add "claude" to the TESTS list in
# standalone.cfg there.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# claude.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
#[claude]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/xymonext.sh claude
#    LOGFILE $XYMONCLIENTLOGS/claude.log
#    INTERVAL 15m
