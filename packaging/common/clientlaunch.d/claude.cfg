# Xymon task for the "claude" extension (Claude Code login validity),
# installed into the client's clientlaunch.d.
#
# DISABLED by default: most hosts run no Claude Code, and the check needs
# a sudo rule for ext/claude-expiry.sh first (see sudoers.example). Set
# that up, list the accounts in etc/my-xymon-extensions/claude.cfg, then
# remove the comment markers below. OpenWrt/standalone: add "claude" to
# TESTS in standalone.cfg instead.
#
# The interval stays below Xymon's 30-minute status lifetime. xymonext.sh
# measures the run (column "xymonext"); call claude.sh directly to skip it.

#[claude]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/xymonext.sh claude
#    LOGFILE $XYMONCLIENTLOGS/claude.log
#    INTERVAL 15m
