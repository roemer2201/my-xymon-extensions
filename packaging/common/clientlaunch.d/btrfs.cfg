# Xymon task definition for the "btrfs" extension (btrfs filesystem
# health). Shipped by the my-xymon-extensions packages into the
# client's clientlaunch.d directory (or append to clientlaunch.cfg).
#
# The task ships ENABLED: the extension needs no configuration and no
# root rights - it reads /sys/fs/btrfs and /proc. Hosts without a
# mounted btrfs report a "clear" column; comment the block out there if
# you do not want it, or set BTRFS_ENABLE="no" in
# my-xymon-extensions/btrfs.cfg. The result of the last scrub needs a
# sudo rule (see sudoers.example and BTRFS_SUDO).
#
# Keep the interval stable: throughput, IOPS and commit rates are
# averages since the previous poll.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; there the extension is part of the
# default TESTS list in standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# btrfs.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[btrfs]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh btrfs
    LOGFILE $XYMONCLIENTLOGS/btrfs.log
    INTERVAL 5m
