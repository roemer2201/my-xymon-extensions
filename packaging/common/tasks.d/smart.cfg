# Xymon task definition for the "smart" extension (SMART disk health).
# Shipped by the my-xymon-extensions packages into the client's tasks.d
# directory (or append to clientlaunch.cfg).

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# smart.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[smart]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh smart
    LOGFILE $XYMONCLIENTLOGS/smart.log
    INTERVAL 10m
