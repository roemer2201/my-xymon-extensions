# Xymon task definition for the "wifi" extension (Wi-Fi access point
# metadata). Shipped by the my-xymon-extensions packages into the
# client's tasks.d directory (or append to clientlaunch.cfg).
#
# The task ships DISABLED: hosts with a full Xymon client are rarely
# access points. Enable it (remove the DISABLED line and restart the
# client) only on a Linux AP with iw installed.
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; there the extension is part of the
# default TESTS list in standalone.cfg.)

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# wifi.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[wifi]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh wifi
    LOGFILE $XYMONCLIENTLOGS/wifi.log
    INTERVAL 5m
    DISABLED
