# Xymon task definition for the "diskio" extension (disk I/O metrics).
# Shipped by the my-xymon-extensions packages into the client's tasks.d
# directory (or append to clientlaunch.cfg).
#
# INTERVAL 5m matches the default RRD step, so every RRD slot gets a
# fresh interval average.

[diskio]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/diskio.sh
    LOGFILE $XYMONCLIENTLOGS/diskio.log
    INTERVAL 5m
