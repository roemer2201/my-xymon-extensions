# Xymon task definition for the "opkg" extension (package update
# status on opkg-based systems). Shipped by the my-xymon-extensions
# packages into the client's tasks.d directory (or append to
# clientlaunch.cfg).
#
# DISABLED by default: hosts running a full Xymon client
# (Debian/EL/FreeBSD) have no opkg, so the column would sit at
# "clear" forever. This extension is meant for OpenWrt/TurrisOS,
# where the standalone runner schedules it through the TESTS line in
# standalone.cfg instead - this file is ignored there.

#[opkg]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/opkg.sh
#    LOGFILE $XYMONCLIENTLOGS/opkg.log
#    INTERVAL 6h
