# Xymon task definition for the "memory" extension (memory utilization).
# Shipped by the my-xymon-extensions packages into the client's tasks.d
# directory (or append to clientlaunch.cfg).
#
# DISABLED by default: on a host with a full Xymon client the server
# already builds a "memory" column from the regular client report -
# running this extension there would fight over the same column name.
# Enable it only on hosts whose client does not deliver memory data
# (and consider renaming the column via MEM_COLUMN in memory.cfg).
#
# (Hosts without a Xymon client - OpenWrt/TurrisOS with the standalone
# runner - ignore this file; xymon-run.sh runs every installed
# extension via cron anyway.)

#[memory]
#    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
#    CMD $XYMONCLIENTHOME/ext/memory.sh
#    LOGFILE $XYMONCLIENTLOGS/memory.log
#    INTERVAL 5m
