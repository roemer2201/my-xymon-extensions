# Xymon task definition for the "fritzwan" extension (FRITZ!Box WAN
# throughput monitoring). Shipped by the my-xymon-extensions packages
# into the client's tasks.d directory (or append to clientlaunch.cfg).
#
# The task ships DISABLED: it needs configuration in fritzwan.cfg
# first (TR-064 credentials, or MODE=igd for login-free UPnP polling).
# Configure it on the polling host (normally the Xymon server), then
# remove the DISABLED line and restart the Xymon client.
#
# The reported throughput is the average over the polling interval;
# shorten the interval for finer-grained graphs if desired.

# The command runs through xymonext.sh, which measures how long
# the extension takes, how much CPU it burns and how many bytes
# it sends, and reports that in the "xymonext" column. Call
# fritzwan.sh directly to switch the measurement off for this task
# only; XYMONEXT_ENABLE="no" in xymonext.cfg switches it off
# everywhere.
#
[fritzwan]
    ENVFILE $XYMONCLIENTHOME/etc/xymonclient.cfg
    CMD $XYMONCLIENTHOME/ext/xymonext.sh fritzwan
    LOGFILE $XYMONCLIENTLOGS/fritzwan.log
    INTERVAL 5m
    DISABLED
