# Configuration for the standalone Xymon extension runner
# (xymon-run.sh). POSIX shell, sourced.
#
# Installed as /etc/xymon-standalone/standalone.cfg by the OpenWrt
# package; alternative locations: /etc/xymon-standalone.cfg (legacy),
# $XYMONHOME/etc/standalone.cfg or any path in the STANDALONE_CFG
# environment variable.

# Xymon server to report to (REQUIRED). "host" or "host:port";
# multiple servers space-separated - the reports go to each one.
#XYMSRV="xymon.example.com"

# Which extensions "xymon-run.sh all" runs (space-separated). The
# default below covers the local health tests. Comment the line out
# (or set it empty) to run every extension installed in ext/ instead.
#
# The FRITZ!Box pollers fritzdsl/fritzwan are installed but not listed
# here on purpose: they poll a remote device, which is normally the
# Xymon server's job. If this host is the one that should poll the
# box, configure fritzdsl.cfg/fritzwan.cfg and add them to the list.
#
# wifi reports "clear" on routers without AP radios - remove it from
# the list there if you don't want the extra column.
#
# if_link counts the link state changes of the physical Ethernet
# ports. Keep the cron interval stable: the metric is "changes since
# the previous poll".
#
# lxc reports the LXC containers of the host - which of them should be
# running, and what each one costs. It reports "clear" where the lxc
# tools are not installed; remove it from the list there if you don't
# want the extra column. Keep the cron interval stable here too: cpu
# and network are averages since the previous poll.
TESTS="disk if_link la lxc memory opkg smart temp wifi"

# Measure what the extensions cost this host: with the default "yes"
# every extension is run through xymonext.sh, which reports its
# runtime, CPU time and the bytes it sent in the "xymonext" column.
# The extensions themselves are not affected either way. Set to "no"
# to run them directly (see also xymonext.cfg for the thresholds and
# the finer switches).
#XYMONEXT_ENABLE="yes"

# Hostname to report as. Must match this host's entry in the Xymon
# server's hosts.cfg. Default: hostname -f (fallback: uname -n).
#MACHINEDOTS="router.example.com"

# Where extensions write temporary files (default: /tmp - on OpenWrt
# that is a RAM disk, which is exactly right). Created if missing.
#XYMONTMP="/tmp"

# Where per-extension run logs go (default: $XYMONTMP).
# Created if missing.
#XYMONCLIENTLOGS="/tmp"

# Xymon server port (default: 1984); per-server ports can also be
# given as "host:port" in XYMSRV.
#XYMONDPORT=1984
