# Configuration for the "btrfs" Xymon extension (btrfs filesystem
# health). POSIX shell, sourced by btrfs.sh - keep the quoting.
#
# Installed as $XYMONHOME/etc/my-xymon-extensions/btrfs.cfg
# (Debian/Ubuntu: /etc/xymon/my-xymon-extensions/btrfs.cfg).
# Every setting can also come from the environment; a value set HERE
# wins over that.
#
# The extension works without this file: it finds every mounted btrfs
# filesystem by itself and needs no root rights. Hosts without btrfs
# (and FreeBSD) report "clear". The values shown are the defaults.

# Switch the test off without removing the task: "no" reports a clear
# column ("disabled"). To get rid of the column completely, comment out
# the task in clientlaunch.d/btrfs.cfg.
#BTRFS_ENABLE="yes"

# Xymon column name (default: btrfs).
#BTRFS_COLUMN="btrfs"

# --- which filesystems, and their names -----------------------------------
# A filesystem is named after its label; without a label after its
# shortest mount point ("/" -> root, "/media/raid" -> media_raid). The
# Names are capped at 152 characters; colliding names get a full UUID
# suffix, leaving room for metric suffixes in split-NCV (200 characters).
# The name appears in the status and in the RRD file names
# (btrfs,<name>_<metric>.rrd), so renaming one starts new graphs.
# Override it per filesystem UUID (see "btrfs filesystem show" or
# /sys/fs/btrfs/):
#BTRFS_NAMES="2221fe30-7ed7-4cee-9109-ed341b266b30=raid 38065fdd-24e0-449b-9f6a-b778cba05bc3=system"

# Filesystems that are not monitored at all (UUIDs or names, glob
# patterns, space-separated).
#BTRFS_EXCLUDE=""

# Filesystems that are read-only on purpose (UUIDs or names, globs).
# Any other filesystem whose mounts are all read-only is red: after an
# I/O or checksum error in a critical place the kernel switches btrfs
# to read-only.
#BTRFS_RO_OK=""

# --- space ------------------------------------------------------------------
# btrfs hands out space in chunks. Once every byte of the devices
# belongs to a chunk ("unallocated" is zero) no new chunk can be
# created - and if the metadata chunks fill up then, writes fail with
# ENOSPC although "df" still shows free space.
#
# Unallocated space in percent of the device size below which the
# column turns yellow / red (empty = no check).
#BTRFS_UNALLOC_WARN="5"
#BTRFS_UNALLOC_CRIT=""

# Metadata usage in percent (including the global reserve) at which the
# column turns yellow / red - checked only while no new metadata chunk
# fits into the unallocated space, because before that the metadata can
# simply grow. Empty = no check.
#BTRFS_META_WARN="75"
#BTRFS_META_CRIT="90"

# --- device errors ----------------------------------------------------------
# The kernel counts write, read, flush, corruption and generation errors
# per device and keeps them across reboots until they are reset with
# "btrfs device stats -z <mount point>".
# Color while a counter is above zero (green = only list them):
#BTRFS_ERR_COLOR="yellow"
# Color when a counter grew, held for BTRFS_ERR_HOLD seconds after the
# last increase (0 = only the poll that saw it):
#BTRFS_ERR_NEW_COLOR="red"
#BTRFS_ERR_HOLD="1800"

# --- scrub ------------------------------------------------------------------
# Days after the last scrub at which the column turns BTRFS_SCRUB_COLOR;
# a filesystem that was never scrubbed counts as too old.
# Empty or 0 = no check.
#BTRFS_SCRUB_MAXAGE="35"
#BTRFS_SCRUB_COLOR="yellow"

# The result of the last scrub ("btrfs scrub status") needs root
# rights. As root - the OpenWrt/TurrisOS standalone runner - it is read
# directly. The Xymon client runs as user "xymon": set this to "yes"
# after installing the sudo rule from sudoers.example. Without it only
# the age of the last scrub is known (from the modification time of
# btrfs-progs' status file in /var/lib/btrfs), not its errors.
#BTRFS_SUDO="no"

# Path of btrfs(8) (default: searched in PATH plus /usr/sbin and /sbin).
# With BTRFS_SUDO="yes" it must be the path named in the sudo rule.
#BTRFS_CMD=""

# --- where the data comes from (rarely needs changing; overridable
# mainly for the unit tests) -------------------------------------------------
#BTRFS_SYSFS="/sys/fs/btrfs"
#BTRFS_MOUNTS="/proc/mounts"
#BTRFS_DISKSTATS="/proc/diskstats"
#BTRFS_SCRUBDIR="/var/lib/btrfs"
