# Graph definitions for the "btrfs" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per filesystem and metric, named
# btrfs,<fs>_<metric>.rrd with a single dataset called "lambda". <fs>
# is the filesystem's name in the status (label, mount point or the
# BTRFS_NAMES override), so "/" appears as "root" and "/media/raid" as
# "media_raid". Every FNPATTERN matches however many filesystems a host
# has; the legend is the part of the file name in the outer brackets.
#
# --base=1024 makes rrdtool label byte axes in KiB/MiB/GiB, matching the
# status text. Xymon passes each line to rrdtool as one argument, so a
# long option needs the "=" form.

# Unallocated device space (raw, all copies) and the estimated free
# space for data. When "unalloc" reaches zero, btrfs cannot create new
# chunks: metadata can then run out while "free" still shows plenty.
[btrfsspace]
    FNPATTERN btrfs,(.+_(unalloc|free)).rrd
    TITLE btrfs unallocated and free space
    YAXIS Bytes
    --base=1024
    -l 0
    DEF:s@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:s@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:s@RRDIDX@:LAST: %8.2lf %sB (cur)
    GPRINT:s@RRDIDX@:MIN: %8.2lf %sB (min)\n

# How full the allocated chunks are: data, and metadata including the
# global reserve (the value the metadata thresholds apply to).
[btrfsfill]
    FNPATTERN btrfs,(.+_(datapct|metapct)).rrd
    TITLE btrfs chunk usage
    YAXIS Percent
    -l 0
    -u 100
    DEF:p@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:p@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:p@RRDIDX@:LAST: %6.1lf%% (cur)
    GPRINT:p@RRDIDX@:MAX: %6.1lf%% (max)\n

# Sum of all device error counters of a filesystem (write, read, flush,
# corruption, generation). Steps up when errors occur and drops to zero
# after "btrfs device stats -z".
[btrfserrors]
    FNPATTERN btrfs,(.+)_errors.rrd
    TITLE btrfs device errors
    YAXIS Errors
    -l 0
    --units-exponent=0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:e@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:e@RRDIDX@:LAST: %8.0lf (cur)
    GPRINT:e@RRDIDX@:MAX: %8.0lf (max)\n

# Throughput of the member devices. RAID copies count: a RAID1
# filesystem writes every byte twice.
[btrfsbps]
    FNPATTERN btrfs,(.+)_bps.rrd
    TITLE btrfs throughput (member devices)
    YAXIS Bytes/s
    --base=1024
    -l 0
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %8.2lf %sB/s (cur)
    GPRINT:b@RRDIDX@:MAX: %8.2lf %sB/s (max)
    GPRINT:b@RRDIDX@:AVERAGE: %8.2lf %sB/s (avg)\n

[btrfsiops]
    FNPATTERN btrfs,(.+)_iops.rrd
    TITLE btrfs I/O operations (member devices)
    YAXIS IOPS
    -l 0
    DEF:i@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:i@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:i@RRDIDX@:LAST: %8.1lf (cur)
    GPRINT:i@RRDIDX@:MAX: %8.1lf (max)
    GPRINT:i@RRDIDX@:AVERAGE: %8.1lf (avg)\n

# Utilisation of the busiest member device (share of the time it had
# I/O in flight). Near 100 % the slowest device limits the filesystem.
[btrfsbusy]
    FNPATTERN btrfs,(.+)_busy.rrd
    TITLE btrfs busiest member device
    YAXIS Percent
    -l 0
    -u 100
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:u@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:u@RRDIDX@:LAST: %6.1lf%% (cur)
    GPRINT:u@RRDIDX@:MAX: %6.1lf%% (max)
    GPRINT:u@RRDIDX@:AVERAGE: %6.1lf%% (avg)\n

# Transaction commits per minute (the default commit interval of 30 s
# gives about 2) and their average duration in the poll interval
# (kernel 6.0+, sysfs commit_stats).
[btrfscommits]
    FNPATTERN btrfs,(.+)_commits.rrd
    TITLE btrfs transaction commits
    YAXIS Commits per minute
    -l 0
    DEF:c@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:c@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:c@RRDIDX@:LAST: %6.1lf (cur)
    GPRINT:c@RRDIDX@:MAX: %6.1lf (max)
    GPRINT:c@RRDIDX@:AVERAGE: %6.1lf (avg)\n

[btrfscommitms]
    FNPATTERN btrfs,(.+)_commitms.rrd
    TITLE btrfs average commit duration
    YAXIS Milliseconds
    -l 0
    DEF:d@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:d@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:d@RRDIDX@:LAST: %8.1lf (cur)
    GPRINT:d@RRDIDX@:MAX: %8.1lf (max)
    GPRINT:d@RRDIDX@:AVERAGE: %8.1lf (avg)\n
