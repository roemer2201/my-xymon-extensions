# xymonserver.cfg settings for the "btrfs" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/btrfs.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/btrfs.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# One RRD file per filesystem and metric, named btrfs,<fs>_<metric>.rrd,
# each with a single dataset "lambda". Split-NCV keeps the filesystems of
# a host independent of each other: adding or removing one never touches
# the RRD files of another.
#
# All metrics are gauges. The extension turns the cumulative I/O and
# commit counters into rates itself and skips a poll whose counter went
# backwards (reboot, remount), so no COUNTER/DERIVE handling is needed.
TEST2RRD+=",btrfs=ncv"
SPLITNCV_btrfs="*:GAUGE"

# GRAPHS_btrfs is the list of graphs drawn on the btrfs status page, and
# it is the only place these graphs appear: the trends page finds graphs
# by matching the graph name against the start of the RRD file name
# (lib/xymonrrd.c), and "btrfsspace" is not a prefix of
# "btrfs,root_unalloc.rrd". So list them all; drop the ones you do not
# care about.
GRAPHS+=",btrfsspace,btrfsfill,btrfserrors,btrfsbps,btrfsiops,btrfsbusy,btrfscommits,btrfscommitms"
GRAPHS_btrfs="btrfsspace,btrfsfill,btrfserrors,btrfsbps,btrfsiops,btrfsbusy,btrfscommits,btrfscommitms"
