# xymonserver.cfg settings for the "lxc" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/lxc.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/lxc.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# One RRD file per container and metric, named lxc,<container>_<metric>.rrd,
# each with a single dataset "lambda". Split-NCV (not plain NCV) is what
# keeps a host's containers independent of each other: creating or
# deleting a container adds or orphans its own files and never touches
# the RRD of another one.
#
# All metrics are gauges. The extension turns the cumulative CPU and
# byte counters into rates itself and skips a poll whose counter went
# backwards (container restart), so no COUNTER/DERIVE handling is
# needed here.
TEST2RRD+=",lxc=ncv"
SPLITNCV_lxc="*:GAUGE"

# GRAPHS_lxc is the list of graphs drawn on the lxc status page, and it
# is the ONLY place these graphs appear: the trends page finds graphs by
# matching the graph name against the start of the RRD file name
# (lib/xymonrrd.c, find_xymon_graph()), and "lxcram" is not a prefix of
# "lxc,ca_ram.rrd" - only a graph named "lxc" would be. So a graph that
# is missing from the list below is invisible, everywhere. Hence: list
# them all. Drop the ones you do not care about.
GRAPHS+=",lxccount,lxcram,lxccpu,lxcnetin,lxcnetout"
GRAPHS_lxc="lxccount,lxcram,lxccpu,lxcnetin,lxcnetout"
