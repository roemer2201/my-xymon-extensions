# Configuration for the "lxc" Xymon extension (LXC container status).
# POSIX shell, sourced by lxc.sh - keep the quoting.
#
# Installed as $XYMONHOME/etc/lxc.cfg (Debian/Ubuntu: /etc/xymon/lxc.cfg,
# OpenWrt standalone: /etc/xymon-standalone/lxc.cfg). Every setting can
# also come from the environment; a value set HERE wins over that.
#
# The extension works without this file: it discovers the containers
# through lxc-ls and derives which of them are supposed to run from
# lxc.start.auto, /etc/config/lxc-auto (OpenWrt) and lxc-autostart -L.

# Xymon column name (default: lxc).
#LXC_COLUMN="lxc"

# --- which containers must be running ---------------------------------
# By default a container is expected to run when
#   * its config sets lxc.start.auto (the AUTOSTART column of lxc-ls), or
#   * /etc/config/lxc-auto lists it (how OpenWrt/TurrisOS starts
#     containers - that init script does not need lxc.start.auto), or
#   * lxc-autostart -L names it (that command lists only containers it
#     would start now, so it never sees a running one).
# Such a container that is not running turns the column red; every other
# stopped container is green and marked "not autostarted".

# Explicit list (space-separated glob patterns). When set, it REPLACES
# the automatic detection above: exactly these containers must run.
#LXC_REQUIRED="mail* db01"

# Containers that may be stopped without alarm, even though one of the
# autostart sources lists them (glob patterns).
#LXC_OPTIONAL="build-* test-*"

# Containers that are not monitored at all - no status line, no graph
# (glob patterns).
#LXC_IGNORE="tmp-*"

# Color for a container that should run but does not: red (default) or
# yellow.
#LXC_DOWN_COLOR="red"

# --- optional resource thresholds -------------------------------------
# Both are per container and off by default; the column only reports
# what the containers use. Whole numbers only.
#LXC_RAM_YELLOW="512"        # MiB
#LXC_RAM_RED="1024"          # MiB
#LXC_CPU_YELLOW="80"         # percent of ONE core, averaged over the poll
#LXC_CPU_RED="150"           # interval; may exceed 100 on several cores

# --- where the numbers come from --------------------------------------
# Which metrics are graphed at all (space-separated): ram, cpu, net.
#LXC_METRICS="ram cpu net"

# How the memory usage is measured:
#   auto    the container's cgroup (memory.current), and where that is
#           not accounted - OpenWrt/TurrisOS does not enable the memory
#           controller for the container cgroups, so the file is missing
#           or reads 0 - the sum of the RSS of its processes from /proc.
#           That sum counts shared pages more than once, i.e. it is a
#           slight over-estimate.
#   cgroup  cgroup only; no memory graph where it is not accounted
#   proc    always the /proc sum (one pass over /proc per poll, about
#           0.2 s with 300 processes on a Turris Omnia)
#   off     no memory measurement at all
#LXC_RAM="auto"

# --- paths and tools ---------------------------------------------------
# Normally found automatically; set them when the tools live somewhere
# unusual. lxc-info is only needed for the traffic metrics, lxc-autostart
# only as a third autostart source - both may be missing.
#LXC_LS="/usr/bin/lxc-ls"
#LXC_INFO="/usr/bin/lxc-info"
#LXC_AUTOSTART="/usr/bin/lxc-autostart"

# OpenWrt/TurrisOS autostart configuration (UCI). Ignored where it does
# not exist.
#LXC_UCI_AUTO="/etc/config/lxc-auto"

# cgroup mount point and proc filesystem - only for unusual setups.
#LXC_CGROUPFS="/sys/fs/cgroup"
#LXC_PROC="/proc"
