# wifi.cfg - configuration for the "wifi" Xymon extension
#
# This file is POSIX shell and is sourced by wifi.sh from
# $XYMONHOME/etc/wifi.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#WIFI_COLUMN="wifi"

# Only monitor these AP interfaces (space-separated iw interface
# names, e.g. "phy0-ap0 phy1-ap0"). Default: every interface that
# "iw dev" lists with type AP.
#WIFI_INTERFACES=""

# Tool paths. Empty means: search $PATH. ubus and iwinfo are optional
# (OpenWrt); without them the client count falls back from
# "ubus call hostapd.<if> get_clients" to "iwinfo <if> assoclist",
# and without either the count is simply omitted. iw is required -
# hosts without it report "clear".
#WIFI_IW=""
#WIFI_UBUS=""
#WIFI_IWINFO=""

# Where to read the per-interface byte counters from (rarely needs
# changing; overridable mainly for the unit tests).
#WIFI_SYSNET="/sys/class/net"
