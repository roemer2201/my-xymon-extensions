# xymonserver.cfg settings for the "wifi" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/wifi.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/wifi.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# All wifi metrics are plain gauges: the extension computes the rates
# itself, so no COUNTER/DERIVE handling is needed. One RRD file per
# variable, named wifi,<name>.rrd - the number of files varies with the
# host's radios and SSIDs, which is what split-NCV is for.
TEST2RRD+=",wifi=ncv"
SPLITNCV_wifi="*:GAUGE"

# Graphs on the trends page, and the selection shown on the wifi status
# page itself.
GRAPHS+=",wificlients,wifiutil,wifikbps,wifiair,wifierr,wifinoise,wifichan"
GRAPHS_wifi="wificlients,wifiutil,wifikbps,wifiair,wifierr,wifinoise,wifichan"
