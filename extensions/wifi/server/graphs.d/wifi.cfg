# Graph definitions for the "wifi" Xymon extension.
#
# Include this file from the Xymon server's graphs.cfg, e.g.:
#   include /etc/xymon/graphs.d/wifi.cfg
# (or append its contents to graphs.cfg directly).
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per metric, named wifi,<name>.rrd with a single
# dataset called "lambda". See server/README.md. The FNPATTERNs match
# however many interfaces/radios a host has.
#
# Note: Xymon fills the legend (@RRDPARAM@) from the FIRST capture
# group of FNPATTERN. Where a pattern has inner groups, the outer
# parentheses around the whole metric name are intentional — they make
# the legend include the interface/radio name (e.g. "rxkbps_phy1_ap1"
# instead of just "rx"). Do not remove them.

[wificlients]
    FNPATTERN wifi,clients_(.+).rrd
    TITLE Wi-Fi clients
    YAXIS Clients
    -l 0
    DEF:c@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:c@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:c@RRDIDX@:LAST: %5.0lf (cur)
    GPRINT:c@RRDIDX@:AVERAGE: %5.1lf (avg)
    GPRINT:c@RRDIDX@:MAX: %5.0lf (max)\n

[wifiutil]
    FNPATTERN wifi,((busy|rxpct|txpct)_(.+)).rrd
    TITLE Wi-Fi channel utilization
    YAXIS Percent
    -u 100
    -l 0
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:u@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:u@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:u@RRDIDX@:AVERAGE: %5.1lf%% (avg)
    GPRINT:u@RRDIDX@:MAX: %5.1lf%% (max)\n

[wifikbps]
    FNPATTERN wifi,((rx|tx)kbps_(.+)).rrd
    TITLE Wi-Fi throughput
    YAXIS kbit/s
    -l 0
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %9.1lf (cur)
    GPRINT:b@RRDIDX@:AVERAGE: %9.1lf (avg)
    GPRINT:b@RRDIDX@:MAX: %9.1lf (max)\n

[wifiair]
    FNPATTERN wifi,(air(rx|tx)_(.+)).rrd
    TITLE Wi-Fi client airtime
    YAXIS Percent
    -u 100
    -l 0
    DEF:a@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:a@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:a@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:a@RRDIDX@:AVERAGE: %5.1lf%% (avg)
    GPRINT:a@RRDIDX@:MAX: %5.1lf%% (max)\n

[wifierr]
    FNPATTERN wifi,((retries|failed)_(.+)).rrd
    TITLE Wi-Fi TX retries / failures
    YAXIS per second
    -l 0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:e@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:e@RRDIDX@:LAST: %7.2lf (cur)
    GPRINT:e@RRDIDX@:AVERAGE: %7.2lf (avg)
    GPRINT:e@RRDIDX@:MAX: %7.2lf (max)\n

[wifinoise]
    FNPATTERN wifi,noise_(.+).rrd
    TITLE Wi-Fi noise floor
    YAXIS dBm
    -u -50
    -l -110
    DEF:n@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:n@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:n@RRDIDX@:LAST: %5.0lf dBm (cur)
    GPRINT:n@RRDIDX@:AVERAGE: %5.1lf dBm (avg)
    GPRINT:n@RRDIDX@:MIN: %5.0lf dBm (min)\n

[wifichan]
    FNPATTERN wifi,channel_(.+).rrd
    TITLE Wi-Fi channel in use
    YAXIS Channel
    -l 0
    DEF:h@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:h@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:h@RRDIDX@:LAST: %5.0lf (cur)\n
