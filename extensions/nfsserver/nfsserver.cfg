# Read-only Linux kernel NFS server check. Paths use exports(5) octal escapes.
# Space-separated paths and transport:port pairs that must always be present.
# REQUIRED_EXPORTS="/home /scratchtemp"
# REQUIRED_LISTENERS="tcp:2049 rdma:20049"
# Also compare configured export paths in /etc/exports and exports.d/*.exports.
# CHECK_CONFIGURED=yes
# auto enables global byte rates on Linux 5.12 and later, where nfsd's byte
# counters are 64 bit (Rocky 9 and 10), and leaves them off before. Keep
# auto on Rocky 8 (4.18): its counters are 32 bit, wrap at 4 GiB without
# any wrap count and can lose increments, so yes gives no reliable rate
# there (see README.md, "Rocky 8"). With the nfsserver-sampler task running,
# auto takes its 64-bit totals instead. yes/no force the setting.
# GLOBAL_BYTES=auto
# nfsserver-sampler (kernels before 5.12): the highest data rate per
# direction in Gbit/s, summed over all links that carry NFS. Above it, a
# wrap could go unnoticed, so set it to the line rate, not the usual load.
# SAMPLER_MAX_GBIT=25
# Seconds between two samples: 1, or 0.5 where sleep takes fractions.
# SAMPLER_STEP=1
# Seconds between writes of the totals for nfsserver.sh (1 to 60). The
# receiver warns after two publication intervals or 30 s, whichever is longer.
# SAMPLER_SAVE=10
