# Read-only Linux kernel NFS server check. Paths use exports(5) octal escapes.
# Space-separated paths and transport:port pairs that must always be present.
# REQUIRED_EXPORTS="/home /scratchtemp"
# REQUIRED_LISTENERS="tcp:2049 rdma:20049"
# Also compare configured export paths in /etc/exports and exports.d/*.exports.
# CHECK_CONFIGURED=yes
# auto enables global byte rates on Linux 5.12 and later, where nfsd's byte
# counters are 64 bit (Rocky 9 and 10); on older kernels (Rocky 8: 4.18)
# set yes only after verifying that the vendor's counters are 64 bit.
# GLOBAL_BYTES=auto
