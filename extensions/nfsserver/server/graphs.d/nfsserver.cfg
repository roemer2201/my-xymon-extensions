[nfsexport]
    FNPATTERN ^nfsexport,(.+)\.rrd$
    TITLE NFS payload throughput by export
    YAXIS MiB/s
    -l 0
    DEF:read@RRDIDX@=@RRDFN@:read:AVERAGE
    LINE2:read@RRDIDX@#@COLOR@:@RRDPARAM@ read
    GPRINT:read@RRDIDX@:LAST: %8.2lf (cur)\n
    DEF:write@RRDIDX@=@RRDFN@:write:AVERAGE
    LINE2:write@RRDIDX@#@COLOR@:@RRDPARAM@ write:dashes
    GPRINT:write@RRDIDX@:LAST: %8.2lf (cur)\n
