# xymonserver.cfg settings for the "systemd" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/systemd.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/systemd.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# Plain NCV: a fixed set of two metrics from the extension's "data"
# message, so one systemd.rrd per host with both datasets is enough.
# Both are gauges: "failed" is the number of failed units right now,
# "restarts" the number of automatic service restarts since the
# previous poll (the extension computes that delta itself).
TEST2RRD+=",systemd=ncv"
NCV_systemd="failed:GAUGE,restarts:GAUGE"

GRAPHS+=",systemd"
GRAPHS_systemd="systemd"
