# RRD archive definition for the "systemd" Xymon extension.
#
# Drop this file into the Xymon server's rrddefinitions.d directory,
# or append its contents to rrddefinitions.cfg directly. Debian/Ubuntu
# do not ship that directory - create it and add one line at the end of
# rrddefinitions.cfg:
#   optional directory /etc/xymon/rrddefinitions.d
# See ../README.md.
#
# The section is keyed by the COLUMN name: xymond/do_rrd.c looks the
# RRA definition up with the test name (get_rrd_definition(testname)).
#
# Why this file exists: service restarts are rare single events, and
# Xymon's default archives consolidate with AVERAGE only. In a graph
# longer than 48 hours one point covers 6, 24 or 288 five-minute slots,
# so a single restart is divided by that factor until it is invisible.
# The MAX archives keep the peak of each consolidation window;
# graphs.d/systemd.cfg draws from them. The AVERAGE archives stay: the
# graph needs them for the exact (total) number of restarts.
#
# Steps and rows are Xymon's own defaults - 5 min, 30 min, 2 h and 1 day
# with 576 rows each; only the MAX block is added. Keep the step at the
# default 300 s, graphs.d/systemd.cfg divides by it.
#
# NOTE: this affects RRD files created *after* the file is in place -
# install it before the first report of the extension arrives, or
# delete systemd.rrd once afterwards (see ../README.md).

[systemd]
    RRA:AVERAGE:0.5:1:576
    RRA:AVERAGE:0.5:6:576
    RRA:AVERAGE:0.5:24:576
    RRA:AVERAGE:0.5:288:576
    RRA:MAX:0.5:1:576
    RRA:MAX:0.5:6:576
    RRA:MAX:0.5:24:576
    RRA:MAX:0.5:288:576
