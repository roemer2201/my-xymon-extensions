# Graph definition for the "systemd" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# NCV creates one systemd.rrd per host with the datasets "failed"
# (failed units right now, SYSD_IGNORE excluded) and "restarts"
# (automatic service restarts since the previous poll).
#
# Restarts are single events, like the link changes of if_link, and
# the same two RRDtool effects apply (see the if_link server README,
# "Why the graph showed 0.4"): the values are split across two 5-minute
# slots, and AVERAGE archives dilute a single event until it is
# invisible in a graph longer than 48 hours. So both lines are drawn
# from the MAX archives added by rrddefinitions.d/systemd.cfg, and the
# exact number of restarts in the shown window is printed as (total):
# CDEF turns the stored per-poll count into a rate per second (hence
# the division by the 300 s RRD step) and VDEF TOTAL integrates it back
# into an event count. That is exact as long as the poll interval
# equals the step. Without MAX archives rrdtool silently falls back to
# AVERAGE, so the graph also renders before step 2 of the README.
#
# --units-exponent=0 keeps rrdtool from labelling a y-axis that peaks
# below 1 with SI prefixes ("500 m" instead of 0.5). It needs the "="
# form: Xymon passes each line to rrdtool as a single argument.

[systemd]
    TITLE systemd failed units and service restarts
    YAXIS Count
    -l 0
    --units-exponent=0
    DEF:failed=systemd.rrd:failed:MAX
    DEF:rmax=systemd.rrd:restarts:MAX
    DEF:ravg=systemd.rrd:restarts:AVERAGE
    CDEF:rrate=ravg,300,/
    VDEF:rtotal=rrate,TOTAL
    LINE2:failed#CC0000:Failed units
    GPRINT:failed:LAST: %5.1lf (cur)
    GPRINT:failed:MAX: %5.1lf (max)\n
    LINE2:rmax#0000CC:Restarts per poll
    GPRINT:rmax:MAX: %5.1lf (peak)
    GPRINT:rtotal: %5.0lf (total)\n
