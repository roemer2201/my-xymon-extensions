# Configuration for the "systemd" Xymon extension (systemd service
# manager health). POSIX shell, sourced by systemd.sh - keep the quoting.
#
# Installed as $XYMONHOME/etc/my-xymon-extensions/systemd.cfg
# (Debian/Ubuntu: /etc/xymon/my-xymon-extensions/systemd.cfg).
# Every setting can also come from the environment; a value set HERE
# wins over that.
#
# The extension works without this file: it reports the system state,
# every failed unit and every automatic service restart. Hosts that are
# not booted with systemd (FreeBSD, other init systems) report "clear".
#
# All variables start with SYSD_ and not SYSTEMD_ on purpose: systemd
# itself reads many SYSTEMD_* environment variables.

# Switch the test off without removing the task: "no" reports a clear
# column ("disabled") instead of checking anything. To get rid of the
# column completely, comment out the task in clientlaunch.d/systemd.cfg.
#SYSD_ENABLE="yes"

# Xymon column name (default: systemd).
#SYSD_COLUMN="systemd"

# --- failed units -------------------------------------------------------
# Every unit in the "failed" state colors the column - any unit type,
# not only services (a failed mount or timer is just as relevant).
# Color for a failed unit: red (default) or yellow.
#SYSD_FAILED_COLOR="red"

# Failed units that are listed but do not count at all (glob patterns,
# space-separated). They are not part of the "failed" graph either.
#SYSD_IGNORE="systemd-networkd-wait-online.service NetworkManager-wait-online.service"

# Failed units that only turn the column yellow (glob patterns).
#SYSD_WARN="dnf-makecache.service apt-daily*.service"

# --- required units -------------------------------------------------------
# Units that must be active (space-separated unit names, no globs).
# A name without a suffix means ".service", just like with systemctl.
# Aliases are resolved by systemd: Debian/Ubuntu's ssh.service declares
# Alias=sshd.service, so "sshd" works there as well as on Rocky.
# A unit that is not active - or does not exist at all - colors the
# column with SYSD_DOWN_COLOR.
#SYSD_REQUIRED="sshd chronyd"

# Color for a required unit that is not active: red (default) or yellow.
#SYSD_DOWN_COLOR="red"

# --- automatic restarts -----------------------------------------------------
# A service that systemd restarted by itself (Restart=) since the
# previous poll colors the column - it crashed. The color stays for
# SYSD_RESTART_HOLD seconds after the LAST restart seen, so a single
# crash is not gone again at the next poll (default 1800 = 30 min;
# 0 = only the poll that saw the restart).
#SYSD_RESTART_HOLD="1800"

# Color for a restarted service: yellow (default), red, or green to
# only list and graph the restarts without ever alarming on them.
#SYSD_RESTART_COLOR="yellow"

# Services whose restarts are ignored (glob patterns) - e.g. a service
# that is meant to exit and be restarted periodically. They are listed
# but neither color the column nor count in the "restarts" graph.
#SYSD_RESTART_IGNORE="certbot*.service"

# --- system state -------------------------------------------------------------
# "systemctl is-system-running" reports "initializing" or "starting"
# while the host boots and "stopping" while it shuts down. Color for
# those: yellow (default), red, or green. "maintenance" (rescue or
# emergency target) is always red; "degraded" is judged by the failed
# units above, so ignored units do not keep the column yellow.
#SYSD_TRANSITION_COLOR="yellow"

# --- paths ------------------------------------------------------------------------
# Normally found automatically.
#SYSD_SYSTEMCTL="/usr/bin/systemctl"

# Directory that exists if and only if the host was booted with systemd
# (see sd_booted(3)). Only for unusual setups.
#SYSD_RUNDIR="/run/systemd/system"
