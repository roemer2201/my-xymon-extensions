# if_link.cfg - configuration for the "if_link" Xymon extension
#
# This file is POSIX shell and is sourced by if_link.sh from
# $XYMONHOME/etc/if_link.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#IF_LINK_COLUMN="if_link"

# ----------------------------------------------------------------------
# Which interfaces are monitored
# ----------------------------------------------------------------------
# By default every physical Ethernet port is picked up automatically:
# ARPHRD_ETHER devices with a "device" link in sysfs. That includes
# plain NICs and the individual DSA switch ports of a router
# (lan0..lan4 on a Turris Omnia), and excludes bridges, veth pairs
# (docker), tunnels and the loopback.

# Monitor exactly these interfaces instead of auto-detecting them.
# Space-separated, glob patterns allowed ("lan* eth0"). An interface
# named here is monitored regardless of its kind - the wireless and
# virtual switches below no longer apply to it.
#IF_LINK_INTERFACES=""

# Never monitor these, whatever the auto-detection or the list above
# says. Space-separated, glob patterns allowed. Useful for ports that
# are known to flap by design, e.g. a switch port with a device that
# powers down at night.
#IF_LINK_EXCLUDE=""

# Include wireless interfaces (phy0-ap0 and friends). Their carrier
# only changes when hostapd restarts the interface, not when a client
# roams, so this is off by default - the "wifi" extension covers the
# radios.
#IF_LINK_WIRELESS="no"

# Include virtual interfaces (bridges, veth pairs, docker0, ...).
# Off by default: their carrier follows the member ports, and
# container veth devices come and go with the containers, which would
# create a new RRD file per container start.
#IF_LINK_VIRTUAL="no"

# ----------------------------------------------------------------------
# Thresholds (all optional - without them the column is always green)
# ----------------------------------------------------------------------
# The threshold is the number of link changes counted since the
# previous poll, i.e. per poll interval. Remember that a single short
# outage is TWO changes (down + up), so a value of 2 means "one flap
# per interval is enough".

# Global thresholds for every monitored interface.
#IF_LINK_YELLOW="2"
#IF_LINK_RED="10"

# Per-interface overrides: space-separated "<glob>:<yellow>:<red>"
# entries, first match wins and replaces the global values above.
# An empty field means "no threshold for this color", so a pattern
# can also switch alerting off again for single ports:
#
#   IF_LINK_THRESHOLDS="lan4:2:6 eth1:2:4 lan0::"
#
# (lan4 and eth1 get their own limits; lan0 never alerts.)
#IF_LINK_THRESHOLDS=""

# ----------------------------------------------------------------------
# Where to read the interfaces from (rarely needs changing;
# overridable mainly for the unit tests).
#IF_LINK_SYSNET="/sys/class/net"
