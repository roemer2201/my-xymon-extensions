# RRD archive definition for the "if_link" Xymon extension.
#
# Include this file from the Xymon server's rrddefinitions.cfg, e.g.:
#   include /etc/xymon/rrddefinitions.d/if_link.cfg
# (or append its contents to rrddefinitions.cfg directly).
#
# Why this file exists
# --------------------
# Link changes are rare single events, and Xymon's default archives
# consolidate with AVERAGE only. In a graph longer than 48 hours one
# point covers 6, 24 or 288 five-minute slots, so a single flap is
# divided by the consolidation factor of the view: a measured 2-change
# flap drew 0.39 in a 5-day graph, 0.20 in a 12-day one and 0.07 over
# 40 days. The event is still in the data, but it is diluted until it
# is invisible.
#
# The MAX archives below keep the peak of each consolidation window, so
# graphs.d/if_link.cfg draws that flap at its stored height of 1.33 in
# every time range instead. The AVERAGE archives stay: the graph still
# needs them to compute the exact number of changes in the shown window
# (VDEF ... TOTAL).
#
# Note the 1.33: the MAX archives do not make the per-slot values whole
# numbers, and nothing can - RRDtool aligns its 5-minute grid to the
# epoch, so a poll that sits at a fixed offset inside the grid has every
# value split across two slots (2 changes -> 1.33 + 0.67 at an offset of
# 100 s). What these archives fix is the dilution over long time ranges;
# for an exact count, read the (total) figure of the graph.
#
# Steps and rows are Xymon's own defaults - 5 min, 30 min, 2 h and 1 day
# with 576 rows each - so the retention of an if_link RRD is unchanged;
# only the MAX block is new.
#
# Keep the step at the default 300 s. graphs.d/if_link.cfg divides the
# stored per-poll count by it to obtain a rate for the total, and the
# extension's metric is "changes since the previous poll", which is only
# comparable across time at a constant poll interval anyway. If you do
# change the step (a "-s" line here), change the divisor there to match.
#
# NOTE: this affects RRD files created *after* the change - existing
# files keep the archives they were created with. See ../README.md for
# the one-time removal of the current if_link RRDs.

[if_link]
    RRA:AVERAGE:0.5:1:576
    RRA:AVERAGE:0.5:6:576
    RRA:AVERAGE:0.5:24:576
    RRA:AVERAGE:0.5:288:576
    RRA:MAX:0.5:1:576
    RRA:MAX:0.5:6:576
    RRA:MAX:0.5:24:576
    RRA:MAX:0.5:288:576
