# Graph definition for the "if_link" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per interface, named if_link,changes_<if>.rrd
# with a single dataset called "lambda". See server/README.md. The
# FNPATTERN matches however many interfaces a host has.
#
# The value is the number of link state transitions counted since the
# previous poll, so the graph sits at zero almost all of the time and
# spikes when a port flaps. One LINE2 per interface (rather than a
# stacked area) keeps the ports distinguishable when several flap at
# once, e.g. during a switch reboot.
#
# The line is drawn from the MAX archives added by
# rrddefinitions.d/if_link.cfg. A flap is a single event in one or two
# 5-minute slots, and AVERAGE divides it by the consolidation factor of
# the view: a measured 2-change flap drew 0.39 in a 5-day graph, 0.20 in
# a 12-day one and 0.07 over 40 days, while MAX keeps it at its stored
# height of 1.33 in every time range. If the file has no MAX archives
# rrdtool does not fail - it silently falls back to AVERAGE, so this
# definition also works (with the old, diluted picture) before the RRDs
# have been recreated.
#
# Reading the graph: neither line is a count. The stored per-slot values
# are fractional because RRDtool aligns its 5-minute grid to the epoch
# and the poll times sit at a fixed offset inside it, so every value is
# split across two slots (2 changes -> 1.33 + 0.67 at an offset of 100
# s). The exact number of changes in the shown window is therefore the
# (total) figure: CDEF r turns the stored per-poll count into a rate per
# second (hence the division by the 300 s RRD step) and VDEF TOTAL
# integrates it back into an event count, which is resolution
# independent and comes out exact as long as the poll interval equals
# the step.
#
# --units-exponent=0 keeps rrdtool from labelling a y-axis that peaks
# below 1 with SI prefixes ("500 m" instead of 0.5). It needs the "="
# form: Xymon passes each line here to rrdtool as a single argument, and
# a long option with a space in it is not parsed.

[iflink]
    FNPATTERN if_link,changes_(.+).rrd
    TITLE Network interface link changes
    YAXIS Changes per poll interval
    -l 0
    --units-exponent=0
    DEF:m@RRDIDX@=@RRDFN@:lambda:MAX
    DEF:a@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:r@RRDIDX@=a@RRDIDX@,300,/
    VDEF:t@RRDIDX@=r@RRDIDX@,TOTAL
    LINE2:m@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:m@RRDIDX@:LAST: %4.1lf (cur)
    GPRINT:m@RRDIDX@:MAX: %4.1lf (peak)
    GPRINT:t@RRDIDX@: %5.0lf (total)\n
