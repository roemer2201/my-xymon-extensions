# fritz-wifi collector configuration: plain shell assignments, read by
# fritz-wifi.sh (--config). Precedence: CLI > environment > this file.
# Never put a password here - it belongs in the password file below.
# Enable only after creating the password file and checking --dry-run.
FRITZ_WIFI_ENABLED=0
# hosts.cfg tag that selects the devices to poll, e.g.
#   192.168.5.7  powerline3.lan  # fritzwifi
FRITZ_WIFI_TAG=fritzwifi
# One "host_or_ip user password" line per device, owned by xymon, mode
# 600 (any group/other permission and it is rejected). "-" as user means
# "xymon"; the password is the rest of the line. Not created by the
# package - see the fritz-wifi README.
FRITZ_WIFI_PASSFILE=@ETCDIR@/my-xymon-extensions-server/fritz.passwd
# TR-064 user for every device; empty = the password file's user column.
FRITZ_WIFI_USER=
FRITZ_WIFI_PORT=49000
# Seconds per request; a dead device costs at most the connect timeout.
FRITZ_WIFI_CONNECT_TIMEOUT=5
FRITZ_WIFI_MAX_TIME=10
# Status lifetime in minutes (the task runs every 5 minutes).
FRITZ_WIFI_LIFETIME=15
# RRD names of the last clean run, per host; default $XYMONVAR/fritz-wifi.
# FRITZ_WIFI_STATE_DIR=/var/lib/xymon/fritz-wifi
