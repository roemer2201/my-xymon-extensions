# Server task ONLY - never also in clientlaunch.d. @ETCDIR@/@BINDIR@ are
# filled in by stage-server.sh. FRITZ_WIFI_ENABLED=0 in the shipped
# config keeps the task idle until the password file is in place.
[fritz-wifi]
    ENVFILE @ETCDIR@/xymonserver.cfg
    CMD @BINDIR@/fritz-wifi.sh --config @ETCDIR@/my-xymon-extensions-server/fritz-wifi.cfg
    LOGFILE $XYMONSERVERLOGS/fritz-wifi.log
    INTERVAL 5m
    MAXTIME 4m
