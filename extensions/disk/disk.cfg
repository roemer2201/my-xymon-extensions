# disk.cfg - configuration for the "disk" Xymon extension
#
# This file is POSIX shell and is sourced by disk.sh from
# $XYMONHOME/etc/disk.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
# The default is "disk" - the STANDARD Xymon column - on purpose:
# this extension is meant for clientless hosts (standalone runner),
# where nothing else fills that column, and the server's stock disk
# graphs and alert rules apply unchanged. NEVER enable this extension
# alongside a full Xymon client without changing the column name
# here: the client reports "disk" itself and the two would overwrite
# each other.
#DISK_COLUMN="disk"

# Global thresholds in percent used (df's Use%/Capacity column).
#DISK_WARN=90
#DISK_CRIT=95

# Per-filesystem thresholds: space-separated PATTERN:WARN:CRIT
# entries. PATTERN is a shell glob matched against the mount point;
# the first matching entry wins, all other filesystems use the global
# thresholds. Example - stricter on /srv, laxer on the small overlay:
#DISK_THRESHOLDS="/srv:80:90 /overlay:95:98"

# Filesystems to hide: space-separated shell globs, matched against
# both the mount point and the device column of df. The default hides
# the tmpfs on /dev and the read-only squashfs on /rom (100% full by
# design on OpenWrt).
#DISK_EXCLUDE="/dev /rom"

# The df command to run (rarely needs changing; overridable mainly
# for the unit tests). Invoked as "$DISK_DF -P -k".
#DISK_DF="df"
