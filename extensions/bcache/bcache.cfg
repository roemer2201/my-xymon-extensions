# Configuration for the "bcache" Xymon extension (Linux bcache block
# layer cache). POSIX shell, sourced by bcache.sh - keep the quoting.
#
# Installed as $XYMONHOME/etc/my-xymon-extensions/bcache.cfg
# (Debian/Ubuntu: /etc/xymon/my-xymon-extensions/bcache.cfg).
# Every setting can also come from the environment; a value set HERE
# wins over that.
#
# The extension works without this file: it finds every cache set and
# backing device in sysfs by itself.

# Xymon column name (default: bcache).
#BCACHE_COLUMN="bcache"

# --- vanished devices ----------------------------------------------------
# Every cache set and backing device seen is remembered by its UUID in
# the state file bcache.<host>.state in this directory. One that
# disappears (e.g. a dirty backing device the kernel stopped after its
# cache device failed) stays BCACHE_VANISHED_COLOR until it comes back.
#
# The default is $XYMONTMP. If that is a tmpfs (check with
# "findmnt -T <dir>"), the memory is lost at every reboot, and a device
# missing right after a reboot goes unnoticed. Point this to a
# directory on disk the Xymon client user can write to then, e.g.:
#BCACHE_STATEDIR="/var/lib/xymon"

# Acknowledge a device that was removed on purpose: list its UUID, or
# the first 8 hex digits shown in the graphs and on the status page
# (space-separated). It is dropped from the state file at the next
# poll; leaving the entry here afterwards does no harm - a device that
# shows up again is remembered again.
#BCACHE_FORGET="17e640c6"

# Color for a vanished device: red (default), yellow or green.
#BCACHE_VANISHED_COLOR="red"

# Minimum number of backing devices this host must have, independent
# of the state file. Off by default.
#BCACHE_MIN_BDEVS="6"

# --- expectations and colors ---------------------------------------------
# Expected cache_mode of every backing device attached to a cache set
# (writethrough, writeback, writearound or none). Off by default; a
# device in another mode turns BCACHE_MODE_COLOR (default yellow).
#BCACHE_MODE="writeback"
#BCACHE_MODE_COLOR="yellow"

# A backing device in state "no cache" (not attached to any cache set).
#BCACHE_NOCACHE_COLOR="yellow"

# I/O errors counted on a cache or backing device (io_errors > 0).
#BCACHE_IOERR_COLOR="yellow"

# Cache usage of a cache set with at least one device in writeback mode.
# Above internal/cutoff_writeback (kernel default 40%) only synchronous
# writes are cached, above cutoff_writeback_sync (default 70%) no write
# at all (drivers/md/bcache/writeback.h, should_writeback()).
#BCACHE_CUTOFF_COLOR="yellow"
#BCACHE_CUTOFF_SYNC_COLOR="red"

# Hit ratio of a cache set since the previous poll, in percent. Off by
# default - what is normal depends entirely on the workload. Only
# evaluated when the poll saw at least BCACHE_HIT_MINREQ requests.
#BCACHE_HIT_YELLOW="50"
#BCACHE_HIT_RED="20"
#BCACHE_HIT_MINREQ="1000"

# --- what is read ----------------------------------------------------------
# priority_stats of the cache device (unused/clean/dirty/metadata
# buckets). Reading it copies and sorts the priority of every bucket in
# the kernel - cheap every 5 minutes, but it can be switched off.
#BCACHE_PRIO_STATS="yes"

# Graph the btree usage of each cache set (btree_used_percent and
# root_usage_percent). Off by default - only of interest when analyzing
# bcache itself.
#BCACHE_INTERNAL="no"

# sysfs mount point - only for tests and unusual setups.
#BCACHE_SYSFS="/sys"
