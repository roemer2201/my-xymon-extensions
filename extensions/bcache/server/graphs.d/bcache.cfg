# Graph definitions for the "bcache" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per device and metric, named
# bcache,<id>_<metric>.rrd with a single dataset called "lambda". <id>
# is the first 8 hex digits of the backing device UUID (as in
# /dev/bcache/by-uuid/) or of the cache set UUID (the directory name in
# /sys/fs/bcache/). The status page shows which bcacheN and sdX belong
# to which id.
#
# Xymon fills the legend (@RRDPARAM@) from the FIRST capture group of
# FNPATTERN. Where a graph combines several metrics, the group spans
# id and metric name, so the legend reads "06912c73_bkclean" rather
# than just the id. The patterns are anchored, so "_dirty" never
# matches "_bkdirty".

# Hit ratio since the previous poll, per backing device plus one line
# for the cache set as a whole.
[bcachehit]
    FNPATTERN ^bcache,([0-9a-z_]+)_hitpct\.rrd$
    TITLE bcache hit ratio
    YAXIS Percent
    -u 100
    -l 0
    DEF:h@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:h@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:h@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:h@RRDIDX@:MIN: %5.1lf%% (min)
    GPRINT:h@RRDIDX@:AVERAGE: %5.1lf%% (avg)\n

# Requests per second of a cache set, as counted by bcache (one per
# I/O; a partial hit counts as a miss). "bp" are requests meant to
# bypass the cache (sequential I/O, cutoffs) that hit or missed anyway.
[bcacheio]
    FNPATTERN ^bcache,([0-9a-z_]+_(?:hits|misses|bphits|bpmisses))\.rrd$
    TITLE bcache requests
    YAXIS Requests/s
    -l 0
    DEF:r@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:r@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:r@RRDIDX@:LAST: %8.1lf (cur)
    GPRINT:r@RRDIDX@:MAX: %8.1lf (max)
    GPRINT:r@RRDIDX@:AVERAGE: %8.1lf (avg)\n

# Dirty data per backing device and the writeback target it is held at
# (writeback_percent of the cache, split by device size): below the
# target, bcache writes back at the minimum rate only.
[bcachedirty]
    FNPATTERN ^bcache,([0-9a-z_]+_(?:dirty|target))\.rrd$
    TITLE bcache dirty data
    YAXIS GiB
    -l 0
    DEF:d@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:d@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:d@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:d@RRDIDX@:MAX: %8.2lf (max)
    GPRINT:d@RRDIDX@:AVERAGE: %8.2lf (avg)\n

# The rate the writeback controller allows - a limit, not the data
# actually written back.
[bcachewb]
    FNPATTERN ^bcache,([0-9a-z_]+)_wbrate\.rrd$
    TITLE bcache writeback rate limit
    YAXIS KiB/s
    -l 0
    DEF:w@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:w@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:w@RRDIDX@:LAST: %10.1lf (cur)
    GPRINT:w@RRDIDX@:MAX: %10.1lf (max)
    GPRINT:w@RRDIDX@:AVERAGE: %10.1lf (avg)\n

# Cache usage: "inuse" (100 - cache_available_percent) against the two
# writeback cutoffs, and the buckets of the cache device by content
# (priority_stats).
[bcacheuse]
    FNPATTERN ^bcache,([0-9a-z_]+_(?:inuse|cutwb|cutsync|bkunused|bkclean|bkdirty|bkmeta))\.rrd$
    TITLE bcache cache usage
    YAXIS Percent
    -u 100
    -l 0
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:u@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:u@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:u@RRDIDX@:MAX: %5.1lf%% (max)
    GPRINT:u@RRDIDX@:AVERAGE: %5.1lf%% (avg)\n

# Throughput of the bcacheN devices, from /sys/block/bcacheN/stat.
[bcachetp]
    FNPATTERN ^bcache,([0-9a-z_]+_(?:rd|wr)bytes)\.rrd$
    TITLE bcache device throughput
    YAXIS MiB/s
    -l 0
    DEF:t@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:t@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:t@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:t@RRDIDX@:MAX: %8.2lf (max)
    GPRINT:t@RRDIDX@:AVERAGE: %8.2lf (avg)\n

[bcacheops]
    FNPATTERN ^bcache,([0-9a-z_]+_(?:rd|wr)ops)\.rrd$
    TITLE bcache device I/O operations
    YAXIS IOPS
    -l 0
    DEF:o@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:o@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:o@RRDIDX@:LAST: %8.1lf (cur)
    GPRINT:o@RRDIDX@:MAX: %8.1lf (max)
    GPRINT:o@RRDIDX@:AVERAGE: %8.1lf (avg)\n

# What the cache device (SSD) reads and writes, from the stat file of
# its partition: cache fills, writeback reads, metadata - the write
# load bcache puts on the SSD.
[bcachessd]
    FNPATTERN ^bcache,([0-9a-z_]+_ssd(?:rd|wr))\.rrd$
    TITLE bcache cache device I/O
    YAXIS MiB/s
    -l 0
    DEF:s@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:s@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:s@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:s@RRDIDX@:MAX: %8.2lf (max)
    GPRINT:s@RRDIDX@:AVERAGE: %8.2lf (avg)\n

# Only with BCACHE_INTERNAL="yes" on the client: btree_used_percent
# (average fill of the btree nodes) and root_usage_percent (the root
# node splits when it gets full, which adds a level to the tree).
[bcachebtr]
    FNPATTERN ^bcache,([0-9a-z_]+_bt(?:used|root))\.rrd$
    TITLE bcache btree usage
    YAXIS Percent
    -u 100
    -l 0
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:b@RRDIDX@:MAX: %5.1lf%% (max)\n
