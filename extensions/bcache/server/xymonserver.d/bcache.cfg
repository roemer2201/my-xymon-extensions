# xymonserver.cfg settings for the "bcache" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/bcache.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/bcache.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# One RRD file per device and metric, named bcache,<id>_<metric>.rrd,
# each with a single dataset "lambda". <id> is the first 8 hex digits
# of the backing device UUID resp. the cache set UUID. Split-NCV keeps
# the devices independent of each other: adding or removing one adds
# or orphans its own files and never touches the RRD of another one.
#
# All metrics are gauges: the extension turns the cumulative counters
# into rates itself and skips a poll whose counter went backwards.
TEST2RRD+=",bcache=ncv"
SPLITNCV_bcache="*:GAUGE"

# GRAPHS_bcache is the list of graphs drawn on the bcache status page,
# and it is the ONLY place these graphs appear: the trends page finds
# graphs by matching the graph name against the start of the RRD file
# name, and "bcachehit" is not a prefix of "bcache,17e640c6_hitpct.rrd".
# A graph missing from the list below is therefore invisible. bcachebtr
# stays empty unless BCACHE_INTERNAL="yes" is set on the client.
GRAPHS+=",bcachehit,bcacheio,bcachedirty,bcachewb,bcacheuse,bcachetp,bcacheops,bcachessd,bcachebtr"
GRAPHS_bcache="bcachehit,bcacheio,bcachedirty,bcachewb,bcacheuse,bcachetp,bcacheops,bcachessd,bcachebtr"
