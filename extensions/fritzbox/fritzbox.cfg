# fritzbox collector configuration: plain shell assignments, read by
# fritzbox.sh (--config). Precedence: CLI > environment > this file.
# Never put a password here - it belongs in the password file below.
# Enable only after creating the password file and checking a dry run:
#   fritzbox.sh --config FILE --set FRITZBOX_ENABLED=1 --dry-run --verbose
FRITZBOX_ENABLED=0
# hosts.cfg tag that selects the boxes to poll, e.g.
#   192.168.178.1  fritz.box  # fritzbox
FRITZBOX_TAG=fritzbox
# Modules, one column each (plc has none: it feeds powerline.sh):
#   dsl=fritzdsl wan=fritzwan sys=fritzsys log=fritzlog fw=fritzfw
#   lan=fritzlan tel=fritztel plc
FRITZBOX_MODULES="dsl wan sys log fw lan tel plc"
# The fritz-wifi password file: one "host_or_ip user password" line per
# device, owned by xymon with mode 600, or root:xymon with mode 640
# (anything else is rejected). "-" as user means "xymon"; the password is
# the rest of the line. Not created by the package - see the README.
FRITZBOX_PASSFILE=@ETCDIR@/my-xymon-extensions-server/fritz.passwd
# TR-064 user for every box; empty = the password file's user column.
# Since FRITZ!OS 7.24 a user name is always required.
FRITZBOX_USER=
FRITZBOX_PORT=49000
FRITZBOX_CONNECT_TIMEOUT=3
FRITZBOX_MAX_TIME=5
# Leave one minute before the task's MAXTIME=4m to deliver statuses.
FRITZBOX_RUN_BUDGET=180
# Status lifetime in minutes (the task runs every 5 minutes).
FRITZBOX_LIFETIME=15
# How long a reboot, a new log entry, a changed exposure or a new device
# keeps its color, in minutes.
FRITZBOX_HOLD_MINUTES=60
# 1 = hide IP addresses, prefixes and long numbers (phone numbers) in
# the fritzlog and fritztel texts.
FRITZBOX_MASK=0
# Per-box state, RRD names and the powerline hand-over files; default
# $XYMONVAR/fritzbox.
# FRITZBOX_STATE_DIR=/var/lib/xymon/fritzbox

# fritzdsl: noise margin (dB, below = bad) and CRC errors per minute
# since the last poll; 0 disables a check. WAN uptime from auto | ppp |
# ip | off (also the connection state of fritzwan).
FRITZBOX_DSL_MARGIN_WARN=6
FRITZBOX_DSL_MARGIN_CRIT=3
FRITZBOX_DSL_CRC_WARN=30
FRITZBOX_DSL_CRC_CRIT=300
FRITZBOX_DSL_WAN_SERVICE=auto
# fritzwan: auto (UPnP/IGD when available, else TR-064) | igd | tr064;
# utilization thresholds in percent, 0 = off.
FRITZBOX_WAN_MODE=auto
FRITZBOX_WAN_UTIL_WARN=0
FRITZBOX_WAN_UTIL_CRIT=0
# fritzsys: clock offset limits in seconds; colors for "update
# available", "last update failed" and "factory default password still
# in use" (green = note only).
FRITZBOX_SYS_CLOCK_WARN=60
FRITZBOX_SYS_CLOCK_CRIT=300
FRITZBOX_SYS_UPDATE_COLOR=yellow
FRITZBOX_SYS_UPDATE_FAILED_COLOR=green
FRITZBOX_SYS_DEFAULTPW_COLOR=yellow
# fritzlog: the rules file, the number of entries shown, and the color
# of an entry no rule matches.
FRITZBOX_LOG_RULES=@ETCDIR@/my-xymon-extensions-server/fritzbox-log.rules
FRITZBOX_LOG_SHOW=20
FRITZBOX_LOG_UNMATCHED_COLOR=yellow
# fritzfw: expected port mappings, PROTOCOL:EXTPORT:CLIENT:INTPORT,
# space-separated; empty = report changes against the last poll.
FRITZBOX_FW_EXPECTED=""
FRITZBOX_FW_COLOR=yellow
# fritzlan: devices that must be active, "MAC" or "MAC=label",
# space-separated; FRITZBOX_LAN_NEW_MAC=1 warns about unknown MACs (off:
# phones and VMs use random MACs).
FRITZBOX_LAN_REQUIRED=""
FRITZBOX_LAN_REQUIRED_COLOR=yellow
FRITZBOX_LAN_NEW_MAC=0
# fritztel: color of a SIP account that is not registered.
FRITZBOX_TEL_COLOR=red
FRITZBOX_SILENT=1
FRITZBOX_VERBOSE=0
