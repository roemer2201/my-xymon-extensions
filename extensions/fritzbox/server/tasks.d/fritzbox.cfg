# Server task ONLY - never also in clientlaunch.d. @ETCDIR@/@BINDIR@ are
# filled in by stage-server.sh. FRITZBOX_ENABLED=0 in the shipped config
# keeps the task idle until the password file is in place.
[fritzbox]
    ENVFILE @ETCDIR@/xymonserver.cfg
    CMD @BINDIR@/fritzbox.sh --config @ETCDIR@/my-xymon-extensions-server/fritzbox.cfg
    LOGFILE $XYMONSERVERLOGS/fritzbox.log
    INTERVAL 5m
    MAXTIME 4m
