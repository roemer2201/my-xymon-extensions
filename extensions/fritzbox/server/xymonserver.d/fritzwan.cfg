# xymonserver.cfg settings for the "fritzwan" column of the server-only
# fritzbox collector. "+=" needs the stock value to exist, so read this
# file after the stock TEST2RRD/GRAPHS lines.
#
# All fritzwan metrics are plain gauges: the collector computes the
# throughput itself, so no COUNTER/DERIVE handling is needed. One RRD
# file per variable, fritzwan,<name>.rrd, from native trends messages -
# the files of the former split-NCV extension. TEST2RRD names no
# xymond_rrd handler (up to 0.28: "fritzwan=ncv"); it only makes
# svcstatus.cgi show GRAPHS_fritzwan.
TEST2RRD+=",fritzwan"

# GRAPHS needs the entry named like the column, or the status page
# shows no graph at all; "::99" keeps all fritzwan files in one trends
# picture of graph [fritzwan] (see xymonserver.d/fritzdsl.cfg).
GRAPHS+=",fritzwan::99"
GRAPHS_fritzwan="fritzwan,fritzwanstate,fritzwanutil,fritzwancap"
