# xymonserver.cfg settings for the "fritzdsl" column of the server-only
# fritzbox collector. "+=" needs the stock value to exist, so read this
# file after the stock TEST2RRD/GRAPHS lines (Debian/Ubuntu: the
# include of /var/run/xymon/xymonserver-include.cfg at the end of
# xymonserver.cfg, written from xymonserver.d at every Xymon start).
#
# The RRDs come from native "data HOST.trends" messages (xymond/rrd/
# do_trends.c), which keep an explicit "U" - one file per metric,
# fritzdsl,<name>.rrd with the single dataset "lambda", the same files
# the former split-NCV extension created, so the history continues. The
# error counters, retrains and reconnects are DERIVE (graphed as rates),
# everything else GAUGE. TEST2RRD names no xymond_rrd handler, so the
# status text is not parsed (up to 0.28 this was "fritzdsl=ncv"); the
# status still carries the values as a hidden NCV block (see the
# fritzbox README).
TEST2RRD+=",fritzdsl"

# The status page draws GRAPHS_fritzdsl, but only if GRAPHS has an
# entry named like the TEST2RRD name of the column - without one it
# draws nothing at all (lib/htmllog.c). The trends page puts every RRD
# file whose name starts with "fritzdsl," under that same entry and
# draws graph [fritzdsl] with them (web/svcstatus-trends.c); "::99"
# allows up to 99 files in one picture. Without it Xymon splits the
# files into pictures of at most 5, and every picture but the first
# stays empty, because [fritzdsl] draws the sync rates only.
GRAPHS+=",fritzdsl::99"
GRAPHS_fritzdsl="fritzdsl,fritzdslmargin,fritzdslatten,fritzdslcrc,fritzdslfec,fritzdslhec,fritzdslsecs,fritzdsluptime,fritzdslevents"
