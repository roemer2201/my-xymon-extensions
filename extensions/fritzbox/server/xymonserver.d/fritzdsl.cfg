# xymonserver.cfg settings for the "fritzdsl" column of the server-only
# fritzbox collector. "+=" needs the stock value to exist, so read this
# file after the stock TEST2RRD/GRAPHS lines (Debian/Ubuntu: the
# directory statement at the end of xymonserver.cfg).
#
# The RRDs come from native "data HOST.trends" messages (xymond/rrd/
# do_trends.c), which keep an explicit "U" - one file per metric,
# fritzdsl,<name>.rrd with the single dataset "lambda", the same files
# the former split-NCV extension created, so the history continues. The
# error counters are DERIVE (graphed as rates), everything else GAUGE.
# TEST2RRD is still needed so svcstatus.cgi shows GRAPHS_fritzdsl at all
# (lib/htmllog.c); no xymond_rrd handler is named "fritzdsl", so the
# status text is not parsed (up to 0.28 this was "fritzdsl=ncv").
TEST2RRD+=",fritzdsl"

# GRAPHS_fritzdsl is the list of graphs drawn on the fritzdsl status
# page, and it is the ONLY place these graphs appear: the trends page
# finds graphs by matching the graph name against the start of the RRD
# file name (lib/xymonrrd.c, find_xymon_graph()), and "fritzdslrate" is
# not a prefix of "fritzdsl,rate_up.rrd" - only a graph named "fritzdsl"
# would be. So a graph missing from the list below is invisible,
# everywhere. Hence: list them all. Drop the ones you do not care about.
GRAPHS+=",fritzdslrate,fritzdslmargin,fritzdslatten,fritzdslerrors,fritzdslfarend,fritzdslsecs,fritzdsluptime"
GRAPHS_fritzdsl="fritzdslrate,fritzdslmargin,fritzdslatten,fritzdslerrors,fritzdslfarend,fritzdslsecs,fritzdsluptime"
