# xymonserver.cfg settings for the fritzsys, fritzlog, fritzfw, fritzlan
# and fritztel columns of the server-only fritzbox collector (fritzdsl
# and fritzwan have files of their own). "+=" needs the stock value to
# exist, so read this file after the stock TEST2RRD/GRAPHS lines.
#
# The RRDs come from native "data HOST.trends" messages, one file per
# metric (<column>,<name>.rrd, dataset "lambda", all GAUGE). TEST2RRD
# names no xymond_rrd handler, so the status texts are never parsed; it
# only makes svcstatus.cgi show the GRAPHS_<column> lists.
TEST2RRD+=",fritzsys,fritzlog,fritzfw,fritzlan,fritztel"

# The trends page matches graph names against the start of the RRD file
# name, so only a graph named exactly like the column appears there;
# GRAPHS_<column> is the status page, in display order.
GRAPHS+=",fritzsys,fritzsysclock,fritzlog,fritzfw,fritzlan,fritzlanhosts,fritztel"
GRAPHS_fritzsys="fritzsys,fritzsysclock"
GRAPHS_fritzlog="fritzlog"
GRAPHS_fritzfw="fritzfw"
GRAPHS_fritzlan="fritzlan,fritzlanhosts"
GRAPHS_fritztel="fritztel"
