# Graph definitions for the "fritzdsl" column of the fritzbox collector.
#
# Installed by my-xymon-extensions-server into /etc/xymon/graphs.d/.
# The RRD files come from the collector's trends messages: one file per
# metric, named fritzdsl,<name>.rrd with a single dataset called
# "lambda" (the same files the former split-NCV extension created).
#
# [fritzdsl] is named like the column: the trends page shows it (see
# xymonserver.d/fritzdsl.cfg), the status page all graphs listed in
# GRAPHS_fritzdsl.
#
# The error counters, retrains and reconnects are DERIVE datasets, so
# rrdtool stores rates per second; the graphs scale them to a readable
# unit. --units-exponent=0 keeps rrdtool from labelling small values
# with SI prefixes ("500 m"); it needs the "=" form, because Xymon
# passes each line to rrdtool as a single argument.

[fritzdsl]
    FNPATTERN fritzdsl,((max)?rate_(down|up)).rrd
    TITLE DSL sync and attainable rate (FRITZ!Box)
    YAXIS kbit/s
    DEF:r@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:r@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:r@RRDIDX@:LAST: %8.0lf (cur)
    GPRINT:r@RRDIDX@:MIN: %8.0lf (min)\n

[fritzdslmargin]
    FNPATTERN fritzdsl,margin_(down|up).rrd
    TITLE DSL noise margin (FRITZ!Box)
    YAXIS dB
    DEF:m@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:m@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:m@RRDIDX@:LAST: %5.1lf (cur)
    GPRINT:m@RRDIDX@:MIN: %5.1lf (min)
    GPRINT:m@RRDIDX@:MAX: %5.1lf (max)\n

[fritzdslatten]
    FNPATTERN fritzdsl,atten_(down|up).rrd
    TITLE DSL line attenuation (FRITZ!Box)
    YAXIS dB
    DEF:a@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:a@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:a@RRDIDX@:LAST: %5.1lf (cur)
    GPRINT:a@RRDIDX@:MAX: %5.1lf (max)\n

# CRC errors per minute, the unit of FRITZBOX_DSL_CRC_WARN/CRIT. The
# near end (crc) and the far end (atuc_crc, ATU-C = DSLAM side).
[fritzdslcrc]
    FNPATTERN fritzdsl,((atuc_)?crc).rrd
    TITLE DSL CRC errors (FRITZ!Box)
    YAXIS Errors/minute
    -l 0
    --units-exponent=0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:m@RRDIDX@=e@RRDIDX@,60,*
    LINE2:m@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:m@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:m@RRDIDX@:AVERAGE: %8.2lf (avg)
    GPRINT:m@RRDIDX@:MAX: %8.2lf (max)\n

# Corrected errors: orders of magnitude more than CRC errors, so a graph
# of their own keeps the CRC lines visible.
[fritzdslfec]
    FNPATTERN fritzdsl,((atuc_)?fec).rrd
    TITLE DSL FEC corrections (FRITZ!Box)
    YAXIS Corrections/second
    -l 0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:e@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:e@RRDIDX@:LAST: %9.1lf (cur)
    GPRINT:e@RRDIDX@:AVERAGE: %9.1lf (avg)
    GPRINT:e@RRDIDX@:MAX: %9.1lf (max)\n

[fritzdslhec]
    FNPATTERN fritzdsl,((atuc_)?hec).rrd
    TITLE DSL HEC errors (FRITZ!Box)
    YAXIS Errors/minute
    -l 0
    --units-exponent=0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:m@RRDIDX@=e@RRDIDX@,60,*
    LINE2:m@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:m@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:m@RRDIDX@:MAX: %8.2lf (max)\n

# Errored and severely errored seconds per hour of line time.
[fritzdslsecs]
    FNPATTERN fritzdsl,(es|ses).rrd
    TITLE DSL errored seconds (FRITZ!Box)
    YAXIS Seconds/hour
    -l 0
    --units-exponent=0
    DEF:s@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:h@RRDIDX@=s@RRDIDX@,3600,*
    LINE2:h@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:h@RRDIDX@:LAST: %7.1lf (cur)
    GPRINT:h@RRDIDX@:AVERAGE: %7.1lf (avg)
    GPRINT:h@RRDIDX@:MAX: %7.1lf (max)\n

# The WAN connection uptime in hours: every drop of the sawtooth is a
# new connection (the daily forced reconnect, or an outage).
[fritzdsluptime]
    FNPATTERN fritzdsl,(uptime).rrd
    TITLE WAN connection uptime (FRITZ!Box)
    YAXIS Hours
    -l 0
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:h@RRDIDX@=u@RRDIDX@,3600,/
    LINE2:h@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:h@RRDIDX@:LAST: %7.1lf (cur)
    GPRINT:h@RRDIDX@:MAX: %7.1lf (max)\n

# DSL resyncs (retrain, counted by the box) and WAN reconnects (counted
# by the collector from a shorter uptime) as one vertical mark each. A
# mark spans the RRD slots of the poll interval, so it stays visible in
# week and month views. VDEF TOTAL integrates the stored rate back into
# the exact number of events in the shown period. The blank before the
# TICK legend is deliberate: rrdtool 1.7.2 drops its first character.
[fritzdslevents]
    FNPATTERN fritzdsl,(retrain|reconnect).rrd
    TITLE DSL resyncs and WAN reconnects (FRITZ!Box)
    YAXIS Events
    -l 0
    -u 1
    --rigid
    --units-exponent=0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    VDEF:t@RRDIDX@=e@RRDIDX@,TOTAL
    TICK:e@RRDIDX@#@COLOR@:1.0: @RRDPARAM@
    GPRINT:t@RRDIDX@: %5.0lf (total)\n
