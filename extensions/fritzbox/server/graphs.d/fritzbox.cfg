# Graph definitions for the fritzsys, fritzlog, fritzfw, fritzlan and
# fritztel columns of the fritzbox collector (fritzdsl and fritzwan have
# files of their own).
#
# Installed by my-xymon-extensions-server into /etc/xymon/graphs.d/.
# The RRD files come from the collector's trends messages: one file per
# metric, <column>,<name>.rrd with a single dataset "lambda". The graph
# named like the column is the one the trends page shows (it matches
# graph names against the start of the RRD file name).

[fritzsys]
    FNPATTERN fritzsys,(uptime).rrd
    TITLE FRITZ!Box uptime
    YAXIS Days
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:ud@RRDIDX@=u@RRDIDX@,86400,/
    LINE2:ud@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:ud@RRDIDX@:LAST: %6.2lf (cur)
    GPRINT:ud@RRDIDX@:MAX: %6.2lf (max)\n

[fritzsysclock]
    FNPATTERN fritzsys,(clock_offset).rrd
    TITLE FRITZ!Box clock offset to the Xymon server
    YAXIS Seconds
    DEF:c@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:c@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:c@RRDIDX@:LAST: %6.0lf (cur)
    GPRINT:c@RRDIDX@:MIN: %6.0lf (min)
    GPRINT:c@RRDIDX@:MAX: %6.0lf (max)\n

# One line per rules-file category plus "unmatched": new entries per
# poll (5 minutes).
[fritzlog]
    FNPATTERN fritzlog,(.*).rrd
    TITLE FRITZ!Box event log entries
    YAXIS Entries/poll
    -l 0
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:e@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:e@RRDIDX@:LAST: %5.0lf (cur)
    GPRINT:e@RRDIDX@:MAX: %5.0lf (max)\n

[fritzfw]
    FNPATTERN fritzfw,(portmaps).rrd
    TITLE FRITZ!Box port mappings
    YAXIS Mappings
    -l 0
    DEF:p@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:p@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:p@RRDIDX@:LAST: %4.0lf (cur)
    GPRINT:p@RRDIDX@:MAX: %4.0lf (max)\n

[fritzlan]
    FNPATTERN fritzlan,(bps_(in|out)).rrd
    TITLE FRITZ!Box LAN throughput (in = from LAN, out = to LAN)
    YAXIS bit/s
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %9.0lf (cur)
    GPRINT:b@RRDIDX@:AVERAGE: %9.0lf (avg)
    GPRINT:b@RRDIDX@:MAX: %9.0lf (max)\n

[fritzlanhosts]
    FNPATTERN fritzlan,(hosts_(total|active)|active_(eth|wlan|plc|other)|guests_active).rrd
    TITLE FRITZ!Box LAN hosts
    YAXIS Hosts
    -l 0
    DEF:h@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:h@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:h@RRDIDX@:LAST: %5.0lf (cur)
    GPRINT:h@RRDIDX@:MAX: %5.0lf (max)\n

[fritztel]
    FNPATTERN fritztel,(sip_(total|registered)).rrd
    TITLE FRITZ!Box SIP accounts
    YAXIS Accounts
    -l 0
    DEF:s@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:s@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:s@RRDIDX@:LAST: %3.0lf (cur)
    GPRINT:s@RRDIDX@:MIN: %3.0lf (min)\n
