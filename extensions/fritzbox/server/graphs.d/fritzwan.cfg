# Graph definitions for the "fritzwan" column of the fritzbox collector.
#
# Installed by my-xymon-extensions-server into /etc/xymon/graphs.d/.
# The RRD files come from the collector's trends messages: one file per
# metric, named fritzwan,<name>.rrd with a single dataset called
# "lambda" (the same files the former split-NCV extension created).
#
# [fritzwan] is named like the column: the trends page shows it (see
# xymonserver.d/fritzwan.cfg), the status page all graphs listed in
# GRAPHS_fritzwan.

# Throughput, and the volume transferred in the shown period: VDEF
# TOTAL integrates bit/s over time, /8 and /2^30 make it GiB.
[fritzwan]
    FNPATTERN fritzwan,(bps_(down|up)).rrd
    TITLE WAN throughput (FRITZ!Box)
    YAXIS bit/s
    -l 0
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:g@RRDIDX@=b@RRDIDX@,8,/,1073741824,/
    VDEF:v@RRDIDX@=g@RRDIDX@,TOTAL
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %9.0lf (cur)
    GPRINT:b@RRDIDX@:AVERAGE: %9.0lf (avg)
    GPRINT:b@RRDIDX@:MAX: %9.0lf (max)
    GPRINT:v@RRDIDX@: %8.2lf GiB (total)\n

# The link capacity the box uses as 100% (IGD when available).
[fritzwancap]
    FNPATTERN fritzwan,(maxbps_(down|up)).rrd
    TITLE WAN link capacity (FRITZ!Box)
    YAXIS bit/s
    DEF:c@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:c@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:c@RRDIDX@:LAST: %9.0lf (cur)
    GPRINT:c@RRDIDX@:MIN: %9.0lf (min)\n

[fritzwanutil]
    FNPATTERN fritzwan,util_(down|up).rrd
    TITLE WAN link utilization (FRITZ!Box)
    YAXIS Percent
    -u 100
    -l 0
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:u@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:u@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:u@RRDIDX@:AVERAGE: %5.1lf%% (avg)
    GPRINT:u@RRDIDX@:MAX: %5.1lf%% (max)\n

# Link (physical, 1 = Up) and internet connection (PPP/IP, 1 =
# Connected): a drop to 0 is an outage, a gap a failed poll. (avail) is
# the share of the shown period in which the value was 1.
[fritzwanstate]
    FNPATTERN fritzwan,(link_up|connected).rrd
    TITLE WAN link and internet connection (FRITZ!Box)
    YAXIS 1 = up
    -l -0.1
    -u 1.1
    --rigid
    --units-exponent=0
    DEF:s@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:p@RRDIDX@=s@RRDIDX@,100,*
    LINE2:s@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:s@RRDIDX@:LAST: %3.0lf (cur)
    GPRINT:p@RRDIDX@:AVERAGE: %6.2lf%% (avail)\n
