# Each libvirt VM and metric has its own RRD file and lambda dataset.

[libvirt]
    FNPATTERN ^libvirt,(.+)_cpu\.rrd$
    TITLE VM CPU utilization
    YAXIS Percent of one core
    -l 0
    DEF:m@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:m@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:m@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:m@RRDIDX@:MAX: %8.2lf (max)\n

[libvirtrss]
    FNPATTERN ^libvirt,(.+)_rss\.rrd$
    TITLE QEMU resident memory (RSS)
    YAXIS MiB
    -l 0
