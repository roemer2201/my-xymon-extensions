# Native trends messages create the RRDs and carry explicit unknowns.
# The graph named libvirt is the CPU graph and is also shown in trends.
TEST2RRD+=",libvirt"
GRAPHS+=",libvirt::99,libvirtrss,libvirtrx,libvirttx,libvirtread,libvirtwrite"
GRAPHS_libvirt="libvirt,libvirtrss,libvirtrx,libvirttx,libvirtread,libvirtwrite"
