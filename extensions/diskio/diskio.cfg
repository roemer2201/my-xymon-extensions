# diskio.cfg -- configuration for the "diskio" Xymon client extension.
#
# This file is sourced by diskio.sh as POSIX shell code. Every setting
# is optional; the values shown commented out are the built-in
# defaults, so the extension works without this file.

# Device layers to report:
#   pd = physical/whole disks        md = Linux md software RAID
#   lv = LVM logical volumes         cr = dm-crypt/LUKS mappings
#   dm = other device-mapper targets (multipath, ...)
#   zp = ZFS pools                   gm = FreeBSD GEOM mirror/raid
#LAYERS="pd md lv cr dm zp gm"

# Shell glob patterns of device names to skip, matched against the
# bare kernel/provider/pool name (e.g. "sda", "vg0-root", "tank").
#EXCLUDE="loop* ram* sr* fd* cd* zram* zd* nbd* pass*"

# If set, only devices matching one of these patterns are monitored
# (EXCLUDE is applied first).
#INCLUDE=""

# Sampling window in seconds for the live samples (FreeBSD gstat and
# zpool iostat); clamped to 1..60. On Linux the block-device values
# come from /proc/diskstats deltas over the full run interval instead.
#SAMPLE_SECONDS=10

# Optional alerting. Without threshold lines the column is always
# green (pure trending). Syntax:
#
#   threshold <instance-pattern> <metric> <warn> <crit>
#
# instance-pattern  shell glob matched against the instance name
#                   (pd_sda, md_md0, lv_vg0_root, zp_tank, ...)
# metric            rbps wbps riops wiops rlat wlat util qlen
# warn/crit         numeric limit (>= triggers), or "-" to disable
#                   that level. The first matching line wins.
#
# Examples:
#threshold "pd_*" rlat 50 200      # avg read latency in ms
#threshold "pd_*" wlat 50 200
#threshold "zp_*" rlat 100 500
#threshold "*"    util 95 -        # yellow only, never red
