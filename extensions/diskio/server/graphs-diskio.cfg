    GPRINT:w@RRDIDX@:LAST: %6.2lf (cur)
    GPRINT:w@RRDIDX@:AVERAGE: %6.2lf (avg)
    GPRINT:w@RRDIDX@:MAX: %6.2lf (max)\n

[diskioutil]
    FNPATTERN diskio,(.+)_util.rrd
    TITLE Disk utilization
    YAXIS Percent
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:u@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:u@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:u@RRDIDX@:AVERAGE: %5.1lf%% (avg)
    GPRINT:u@RRDIDX@:MAX: %5.1lf%% (max)\n

[diskioqlen]
    FNPATTERN diskio,(.+)_qlen.rrd
    TITLE Disk queue depth (avg outstanding requests)
    YAXIS Requests
    DEF:q@RRDIDX@=@RRDFN@:lambda:AVERAGE
