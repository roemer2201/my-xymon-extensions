# Graph definition for the "la" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# NCV creates one la.rrd per host with the datasets la1, la5 and la15.
# The graph is called "laext" and not "la" on purpose: Xymon's stock
# [la] graph expects the dataset layout produced from full-client
# reports and would not find these datasets.

[laext]
    TITLE Load average
    YAXIS Load
    DEF:la1=la.rrd:la1:AVERAGE
    DEF:la5=la.rrd:la5:AVERAGE
    DEF:la15=la.rrd:la15:AVERAGE
    LINE1:la1#00CC00:1 min
    LINE2:la5#0000FF:5 min
    LINE1:la15#FF0000:15 min
    GPRINT:la5:LAST: %5.2lf (cur 5 min)\n
