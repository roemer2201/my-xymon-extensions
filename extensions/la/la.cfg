# la.cfg - configuration for the "la" (load average) Xymon extension
#
# This file is POSIX shell and is sourced by la.sh from
# $XYMONHOME/etc/la.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#LA_COLUMN="la"

# Thresholds for the 5-minute load average PER CPU CORE (the reported
# load is divided by the core count before comparing). Fractional
# values are allowed.
#LA_WARN=1.5
#LA_CRIT=3.0

# Number of CPU cores. Empty = detect automatically (nproc,
# /proc/cpuinfo or sysctl hw.ncpu).
#LA_NCPU=""

# Where to read the load averages from (Linux; on FreeBSD
# "sysctl vm.loadavg" is used when this file does not exist).
#LA_LOADAVG="/proc/loadavg"
