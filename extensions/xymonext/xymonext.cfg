# xymonext.cfg - configuration for the "xymonext" Xymon extension
# (cost measurement of the client extensions themselves)
#
# This file is POSIX shell and is sourced by xymonext.sh from
# $XYMONHOME/etc/xymonext.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#XYMONEXT_COLUMN="xymonext"

# Master switch. With "no" the wrapper hands over to the extension
# immediately (exec) and measures nothing - the extensions keep
# working exactly as before, at no measurable cost. Useful on a very
# small router, or to rule the instrumentation out while debugging.
#XYMONEXT_ENABLE="yes"

# Count the bytes each extension sends to the Xymon server. This
# routes the extension's messages through xymonext-send.sh, which
# records the size and then hands the message to the real client.
# Set to "no" to leave the transport completely untouched.
#XYMONEXT_COUNT_BYTES="yes"

# Thresholds on the WALL CLOCK time of a single extension run, in
# seconds. They catch a test that hangs (for instance smartctl waiting
# on a spun-down disk) long before the column goes purple. Set both to
# 0 to switch the thresholds off - the column is then informational
# only, and the graphs still get their data.
#XYMONEXT_WALL_WARN=30
#XYMONEXT_WALL_CRIT=60

# Turn the column yellow when a measured extension exits non-zero.
# The extension's own column normally reports the problem as well;
# set this to "no" if you find the duplicate signal noisy.
#XYMONEXT_RC_WARN="yes"

# How long a measurement stays in the status table, in seconds. An
# extension that has not run within this window drops out of the
# table (its graphs keep the data). Keep this well above the longest
# INTERVAL you use; 0 disables the ageing.
#XYMONEXT_MAXAGE=7200

# Where the wall clock time comes from. "auto" picks the best source
# available on this host, in this order:
#   proc - /proc/uptime, 10 ms and without starting a process
#          (Linux, OpenWrt)
#   time - /usr/bin/time -p, 10 ms (FreeBSD base system; on Linux the
#          "time" package, which is usually not installed)
#   date - date +%s, 1 s resolution only, the last resort
# Pin it to one of those names to test a specific path; a source that
# does not exist on the host is ignored and "auto" applies.
#XYMONEXT_WALLSRC="auto"

# Where the last result per extension is kept - one small file per
# extension. Default: $XYMONTMP/xymonext.d. The directory can be
# deleted at any time; it is rebuilt on the next run.
#XYMONEXT_STATEDIR=""
