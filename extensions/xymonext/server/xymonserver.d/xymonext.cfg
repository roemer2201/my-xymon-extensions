# xymonserver.cfg settings for the "xymonext" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/xymonext.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/xymonext.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# All metrics are plain gauges - each value describes a single run, not
# a counter. Split-NCV keeps underscores and does not truncate dataset
# names, so metrics like wall_if_link arrive intact; one RRD file per
# metric and measured extension, named xymonext,<metric>_<test>.rrd.
TEST2RRD+=",xymonext=ncv"
SPLITNCV_xymonext="*:GAUGE"

# Graphs on the trends page, and on the xymonext status page itself.
GRAPHS+=",xymonextwall,xymonextcpu,xymonextbytes"
GRAPHS_xymonext="xymonextwall,xymonextcpu,xymonextbytes"
