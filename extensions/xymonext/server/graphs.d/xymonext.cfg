# Graph definitions for the "xymonext" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per metric and measured extension, named
# xymonext,<metric>_<extension>.rrd with a single dataset called
# "lambda". See server/README.md. The FNPATTERNs match however many
# extensions a host runs.
#
# The capture group holds the name of the measured extension, so the
# legend reads "smart", "temp", ... - which metric it is comes from
# the graph title.
#
# Every value is measured per run, not per second: a test that runs
# every 10 minutes and burns 0.2s of CPU contributes 0.2 to its curve
# once per interval. Compare the curves between tests, and watch for
# a test whose cost grows over time (more disks, more interfaces,
# more packages to check).

[xymonextwall]
    FNPATTERN xymonext,wall_(.+).rrd
    TITLE Xymon extensions - wall clock time per run
    YAXIS Seconds
    -l 0
    DEF:w@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:w@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:w@RRDIDX@:LAST: %5.2lfs (cur)
    GPRINT:w@RRDIDX@:AVERAGE: %5.2lfs (avg)
    GPRINT:w@RRDIDX@:MAX: %5.2lfs (max)\n

[xymonextcpu]
    FNPATTERN xymonext,cpu_(.+).rrd
    TITLE Xymon extensions - CPU time per run
    YAXIS Seconds
    -l 0
    DEF:c@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:c@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:c@RRDIDX@:LAST: %5.2lfs (cur)
    GPRINT:c@RRDIDX@:AVERAGE: %5.2lfs (avg)
    GPRINT:c@RRDIDX@:MAX: %5.2lfs (max)\n

[xymonextbytes]
    FNPATTERN xymonext,bytes_(.+).rrd
    TITLE Xymon extensions - data sent to the server per run
    YAXIS Bytes
    -l 0
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %5.0lf (cur)
    GPRINT:b@RRDIDX@:AVERAGE: %5.0lf (avg)
    GPRINT:b@RRDIDX@:MAX: %5.0lf (max)\n
