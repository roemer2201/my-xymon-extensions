# Server collector configuration. Plain assignments work both as a trusted
# shell config and through Xymon's environment-file include reader.
# CLI > exported environment > this file > built-in defaults.
# Enable only after installing the sudoers rule and checking --dry-run.
POWERLINE_ENABLED=0
POWERLINE_IFACE=eth0
POWERLINE_LIFETIME=15
POWERLINE_CHANGE_MINUTES=60
POWERLINE_FLAP_MINUTES=180
POWERLINE_MAX_SAMPLE_GAP=900
# Minimum PHY Mbps: off disables each threshold independently.
POWERLINE_TX_PHY_WARN=off
POWERLINE_TX_PHY_CRIT=off
POWERLINE_RX_PHY_WARN=off
POWERLINE_RX_PHY_CRIT=off
# Maximum interval PB error percentage, NOT the cumulative displayed ratio.
POWERLINE_TX_PB_WARN=off
POWERLINE_TX_PB_CRIT=off
POWERLINE_RX_PB_WARN=off
POWERLINE_RX_PB_CRIT=off
# Optional static mapping; read as data, never sourced.
POWERLINE_MAPPING=/etc/xymon/my-xymon-extensions-server/powerline.map
# Persistent state defaults to $XYMONVAR/powerline; override if required.
# POWERLINE_STATE_DIR=/var/lib/xymon/powerline
# POWERLINE_COLLECTOR_HOST=xymon.lan
POWERLINE_SILENT=1
POWERLINE_VERBOSE=0
