# powerline collector configuration: plain shell assignments, read by
# powerline.sh (--config). Precedence: CLI > environment > this file.
# Enable only after installing the sudo rule and checking --dry-run.
POWERLINE_ENABLED=0
POWERLINE_IFACE=eth0
POWERLINE_LIFETIME=15
POWERLINE_CHANGE_MINUTES=60
POWERLINE_FLAP_MINUTES=180
POWERLINE_MAX_SAMPLE_GAP=900
# Forget an adapter absent for this many days (0 = keep it forever).
POWERLINE_RETENTION_DAYS=30
# Minimum PHY Mbps; off disables a threshold.
POWERLINE_TX_PHY_WARN=off
POWERLINE_TX_PHY_CRIT=off
POWERLINE_RX_PHY_WARN=off
POWERLINE_RX_PHY_CRIT=off
# Maximum PB error percent per poll interval (not the lifetime ratio).
POWERLINE_TX_PB_WARN=off
POWERLINE_TX_PB_CRIT=off
POWERLINE_RX_PB_WARN=off
POWERLINE_RX_PB_CRIT=off
# Optional static mapping, read as data. A missing file means no mapping.
POWERLINE_MAPPING=@ETCDIR@/my-xymon-extensions-server/powerline.map
# State defaults to $XYMONVAR/powerline.
# POWERLINE_STATE_DIR=/var/lib/xymon/powerline
# POWERLINE_COLLECTOR_HOST=xymon.lan
POWERLINE_SILENT=1
POWERLINE_VERBOSE=0
