# Native trends: one GAUGE RRD per adapter/peer/metric, DS "value".
# a = reporting PLC MAC, p = peer PLC MAC, slotN = receive slot. Missing
# samples stay unknown. One graph = one metric family at one scale, and
# every RRD matches exactly one pattern (pinned by tests/powerline/run.sh).

[powerline]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_phy_mbps)\.rrd$
    TITLE Powerline PHY rates (not application throughput)
    YAXIS Mbit/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MIN: %8.2lf (min)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineslotphy]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_slot[0-9]+_phy_mbps)\.rrd$
    TITLE Powerline receive slot PHY
    YAXIS Mbit/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MIN: %8.2lf (min)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlinestate]
    FNPATTERN ^powerline,(a[0-9a-f]+_pself_present)\.rrd$
    TITLE Powerline adapter presence
    YAXIS Present
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MIN: %8.2lf (min)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

# rx_pb and rx_all_pb carry the same value; both are drawn.
[powerlinepb]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx_pb|rx_pb|rx_all_pb)_interval_pct)\.rrd$
    TITLE Powerline PB interval error
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MIN: %8.2lf (min)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineslotpb]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_slot[0-9]+_pb_interval_pct)\.rrd$
    TITLE Powerline receive slot PB interval error
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
