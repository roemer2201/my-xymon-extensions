# Native trends: one RRD per stable adapter/peer/metric, DS=value GAUGE.
# a=reporting PLC MAC; p=peer PLC MAC; slotN=receive slot at reporting adapter.
# No UN->0 conversion: missing samples must remain unknown.
#
# One graph = one metric family at one order of magnitude. Two rules follow
# from that, and both were learned the hard way from a ".+" pattern:
#
#  1. Never mix scales. BER sums run into the millions while MPDU counters
#     sit near zero; on one linear axis everything below the largest series
#     collapses onto the zero line.
#  2. Never let two graphs match the same RRD. A pattern catching both
#     _interval_pct and _reported_pct re-draws every series the specific
#     graphs already show, which is a second full attribute list, not a
#     summary.
#
# Series counts below are per adapter PAIR and multiply with every further
# peer, so the split is finer than one pair alone would need.
# tests/powerline/run.sh pins that every RRD the collector emits is matched
# by exactly one pattern here, and that no pattern is left without an RRD.

[powerline]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_phy_mbps)\.rrd$
    TITLE Powerline PHY rates (not application throughput)
    YAXIS Mbit/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineslotphy]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_slot[0-9]+_phy_mbps)\.rrd$
    TITLE Powerline receive slot PHY
    YAXIS Mbit/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlinestate]
    FNPATTERN ^powerline,(a[0-9a-f]+_pself_present)\.rrd$
    TITLE Powerline adapter presence
    YAXIS Present
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

# rx_pb and rx_all_pb carry the same value; both are kept so no RRD
# the collector writes is left undrawn.
[powerlinepb]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx_pb|rx_pb|rx_all_pb)_interval_pct)\.rrd$
    TITLE Powerline PB interval error
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineslotpb]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_slot[0-9]+_pb_interval_pct)\.rrd$
    TITLE Powerline receive slot PB interval error
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineber]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_(?:slot[0-9]+|all)_ber_interval_pct)\.rrd$
    TITLE Powerline BER-sum interval ratio (not FEC BER)
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlinefec]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_all_fec_interval_pct)\.rrd$
    TITLE Powerline receive FEC interval bit error
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

# Only four series, so interval and lifetime share one axis here.
[powerlinempduratio]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_mpdu_(?:interval|reported)_pct)\.rrd$
    TITLE Powerline MPDU error ratio (interval and lifetime)
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

# Lifetime averages. They barely move and must not share an axis with
# the interval ratios, which swing between 0 and 100 on an idle link.
[powerlinepbrep]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_(?:slot[0-9]+_|all_)?pb_reported_pct)\.rrd$
    TITLE Powerline PB error since device reset
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineberrep]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_(?:slot[0-9]+|all)_(?:ber|fec)_reported_pct)\.rrd$
    TITLE Powerline BER and FEC since device reset
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlinecounts]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_pb_(?:pass|fail)_per_second)\.rrd$
    TITLE Powerline PB interval counts
    YAXIS PB/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

# These were written but drawn by nothing before 0.23.0: the PB rate
# pattern above matches rx_pb_*, never rx_slot3_* or rx_all_*.
[powerlineslotpbrate]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_(?:slot[0-9]+|all)_pb_(?:pass|fail)_per_second)\.rrd$
    TITLE Powerline receive slot PB rate
    YAXIS PB/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlineberrate]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_(?:slot[0-9]+|all)_ber_(?:pass|fail)_per_second)\.rrd$
    TITLE Powerline BER-sum rate
    YAXIS Bit errors/s
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlinempdu]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_mpdu_(?:ack|fail|collision)_per_second)\.rrd$
    TITLE Powerline MPDU rates
    YAXIS MPDU/s
    -l 0
