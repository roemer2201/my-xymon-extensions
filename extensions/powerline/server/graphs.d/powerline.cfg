    LINE1:v@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

[powerlinepbtotal]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_(?:slot[0-9]+_|all_)?pb_(?:pass|fail))\.rrd$
    TITLE Powerline PB counters since device reset
    YAXIS PB
    -l 0
