# Only four series, so interval and lifetime share one axis here.
[powerlinempduratio]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_(?:tx|rx)_mpdu_(?:interval|reported)_pct)\.rrd$
    TITLE Powerline MPDU error ratio (interval and lifetime)
    YAXIS Percent
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
