    GPRINT:v@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:v@RRDIDX@:MAX: %8.2lf (max)\n

# Millions, against thousands for the PB counters - hence a graph of
# their own rather than one "cumulative counters" catch-all.
[powerlinebersum]
    FNPATTERN ^powerline,(a[0-9a-f]+_p[0-9a-f]+_rx_(?:slot[0-9]+|all)_ber_(?:pass|fail))\.rrd$
    TITLE Powerline BER sums since device reset
    YAXIS Bit errors
    -l 0
    DEF:v@RRDIDX@=@RRDFN@:value:AVERAGE
