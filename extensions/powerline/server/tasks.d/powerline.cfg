# Server task ONLY - never also in clientlaunch.d. @ETCDIR@/@BINDIR@ are
# filled in by stage-server.sh. POWERLINE_ENABLED=0 in the shipped config
# keeps the PLC untouched until setup is done.
[powerline]
    ENVFILE @ETCDIR@/xymonserver.cfg
    CMD @BINDIR@/powerline.sh --config @ETCDIR@/my-xymon-extensions-server/powerline.cfg
    LOGFILE $XYMONSERVERLOGS/powerline.log
    INTERVAL 5m
    MAXTIME 4m
