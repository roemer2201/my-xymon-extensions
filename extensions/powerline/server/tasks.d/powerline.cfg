# Server task ONLY. Do not also place this in clientlaunch.d.
# The config and program paths below are filled in by the packaging when
# stage-server.sh installs this file, so they match wherever the package
# actually puts them (Debian/Ubuntu: /etc/xymon and the server's ext/).
# POWERLINE_ENABLED=0 in the shipped config prevents PLC access until setup.
[powerline]
    ENVFILE @ETCDIR@/xymonserver.cfg
    CMD @BINDIR@/powerline.sh
    LOGFILE $XYMONSERVERLOGS/powerline.log
    INTERVAL 5m
    MAXTIME 4m
