# Read after the stock GRAPHS settings. Native data HOST.trends is handled by
# Xymon's built-in trends parser; no TEST2RRD/NCV entry is needed.
include /etc/xymon/my-xymon-extensions-server/powerline.cfg
GRAPHS+=",powerline,powerlinepb,powerlinecounts,powerlinempdu,powerlineslotphy,powerlineslotpb,powerlineber,powerlinefec,powerlinereported,powerlineraw,powerlinestate"
GRAPHS_powerline="powerline,powerlinepb,powerlinecounts,powerlinempdu,powerlineslotphy,powerlineslotpb,powerlineber,powerlinefec,powerlinereported,powerlineraw,powerlinestate"
