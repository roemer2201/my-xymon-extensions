# xymonserver.cfg settings for the server-only "powerline" collector.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.
include /etc/xymon/my-xymon-extensions-server/powerline.cfg

# The RRD files themselves are written by Xymon's built-in trends parser
# from the native "data HOST.trends" messages, so no NCV/SPLITNCV entry is
# needed - and unlike NCV that parser passes an explicit "U" straight to
# rrdupdate (xymond/rrd/do_trends.c).
#
# TEST2RRD is still required, for display only: svcstatus.cgi looks up the
# column with find_xymon_rrd() - which knows nothing but TEST2RRD and the
# protocols.cfg tests (lib/xymonrrd.c) - and reads GRAPHS_<column> only
# inside "if (rrd && graph)" (lib/htmllog.c). Without the entry below the
# status page shows no graphs at all. It costs nothing on the writing side:
# update_rrd() in xymond/do_rrd.c has no handler named "powerline" and
# quietly ignores the status message.
TEST2RRD+=",powerline"

# GRAPHS_powerline is the list of graphs drawn on the powerline status page.
# GRAPHS additionally registers "powerline" for the trends page, which finds
# graphs by matching the graph name against the start of the RRD file name
# (lib/xymonrrd.c, find_xymon_graph()): every file here is named
# powerline,<...>.rrd, so only a graph called "powerline" can ever match
# there - the detail graphs below are status-page only, by design.
GRAPHS+=",powerline,powerlinepb,powerlinecounts,powerlinempdu,powerlineslotphy,powerlineslotpb,powerlineber,powerlinefec,powerlinereported,powerlineraw,powerlinestate"
GRAPHS_powerline="powerline,powerlinepb,powerlinecounts,powerlinempdu,powerlineslotphy,powerlineslotpb,powerlineber,powerlinefec,powerlinereported,powerlineraw,powerlinestate"
