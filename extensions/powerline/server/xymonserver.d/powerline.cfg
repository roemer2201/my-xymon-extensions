# xymonserver.cfg settings for the server-only "powerline" collector.
# "+=" needs the stock value to exist, so read this file after the stock
# TEST2RRD/GRAPHS lines. The collector config is deliberately NOT included
# here: POWERLINE_* in the server environment would override --config.

# The RRDs come from native "data HOST.trends" messages (xymond/rrd/
# do_trends.c), which keep an explicit "U". TEST2RRD is still needed so
# svcstatus.cgi shows GRAPHS_powerline at all (lib/htmllog.c); no
# xymond_rrd handler is named "powerline", so the status is not parsed.
TEST2RRD+=",powerline"

# GRAPHS registers "powerline" for the trends page, which matches graph
# names against the start of the RRD file name - only "powerline" can.
# GRAPHS_powerline is the status page, in display order.
GRAPHS+=",powerline,powerlineslotphy,powerlinepb,powerlineslotpb,powerlineber,powerlinefec,powerlinempduratio,powerlinecounts,powerlineslotpbrate,powerlineberrate,powerlinempdu,powerlinepbrep,powerlineberrep,powerlinepbtotal,powerlinebersum,powerlinempduraw,powerlinestate"
GRAPHS_powerline="powerline,powerlineslotphy,powerlinepb,powerlineslotpb,powerlineber,powerlinefec,powerlinempduratio,powerlinecounts,powerlineslotpbrate,powerlineberrate,powerlinempdu,powerlinepbrep,powerlineberrep,powerlinepbtotal,powerlinebersum,powerlinempduraw,powerlinestate"
