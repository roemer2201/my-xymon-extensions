# xymonserver.cfg settings for the "memory" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/memory.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/memory.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# This file assumes the extension's default column name "mem".
#
# The stock TEST2RRD already maps the column "memory" to the built-in
# parser for full-client reports, which cannot read this extension's
# output. With the default column "mem" that entry is not in the way -
# just append a fresh one, which is what happens below.
#
# If you set MEM_COLUMN="memory" on a host that never runs a full
# client, this file is not enough: the first match in TEST2RRD wins, so
# the existing memory entry in xymonserver.cfg has to be changed to
# memory=ncv instead. Use memory/memory.rrd/GRAPHS_memory throughout
# then - here, in graphs.d/memory.cfg and in the DEF line of the graph.
TEST2RRD+=",mem=ncv"
NCV_mem="used:GAUGE"

GRAPHS+=",memused"
GRAPHS_mem="memused"
