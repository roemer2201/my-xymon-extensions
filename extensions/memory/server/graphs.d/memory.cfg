# Graph definition for the "memory" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# NCV creates one mem.rrd per host with a single dataset "used" (the
# extension's default column is "mem"). With MEM_COLUMN="memory" the
# file is memory.rrd - change the DEF line accordingly.

[memused]
    TITLE Memory used
    YAXIS Percent
    DEF:used=mem.rrd:used:AVERAGE
    LINE2:used#0000FF:memory used
    GPRINT:used:LAST: %5.1lf%% (cur)
    GPRINT:used:MAX: %5.1lf%% (max)\n
