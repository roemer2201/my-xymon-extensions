# memory.cfg - configuration for the "memory" Xymon extension
#
# This file is POSIX shell and is sourced by memory.sh from
# $XYMONHOME/etc/memory.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
# NOTE: on a host with a full Xymon client the server already builds
# a "memory" column from the client report - the default here is
# "mem" precisely to avoid that collision (or keep the extension
# disabled there, which is the shipped tasks.d default). Only set
# this to "memory" if this host never runs alongside a full client.
#MEM_COLUMN="mem"

# Thresholds in percent of memory used
# ((MemTotal - MemAvailable) / MemTotal * 100).
#MEM_WARN=80
#MEM_CRIT=90

# Where to read the memory information from (rarely needs changing;
# overridable mainly for the unit tests).
#MEM_MEMINFO="/proc/meminfo"
