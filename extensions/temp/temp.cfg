# temp.cfg - configuration for the "temp" Xymon extension
#
# This file is POSIX shell and is sourced by temp.sh from
# $XYMONHOME/etc/temp.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#TEMP_COLUMN="temp"

# Thresholds in degrees Celsius, applied to every sensor; the column
# color is the worst of all sensor colors. Fractional values are
# allowed.
#TEMP_WARN=80
#TEMP_CRIT=90

# Sysfs locations to scan (rarely need changing; overridable mainly
# for the unit tests).
#TEMP_HWMON_DIR="/sys/class/hwmon"
#TEMP_THERMAL_DIR="/sys/class/thermal"
