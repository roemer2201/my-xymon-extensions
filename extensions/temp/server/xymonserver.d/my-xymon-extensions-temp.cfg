# xymonserver.cfg settings for the "temp" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/my-xymon-extensions-temp.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/my-xymon-extensions-temp.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# Keep the file name as it is. xymonserver.d is shared with other
# packages - hobbit-plugins ships a temp.cfg of its own - and the name
# decides two things: dpkg refuses two packages claiming one path, and
# the drop-ins are read in alphabetical order, which matters below.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# The number of sensors varies per host, so use split-NCV: one RRD file
# per sensor, named temp,<sensor>.rrd with a single dataset "lambda".
#
# CAVEAT 1 - the first match in TEST2RRD wins (xymond builds a tree from
# it and keeps the first entry per test name). If your stock TEST2RRD
# already contains a "temp" entry, appending here has no effect - edit
# that entry in xymonserver.cfg to read temp=ncv instead and delete the
# line below.
#
# CAVEAT 2 - hobbit-plugins ships xymonserver.d/temp.cfg with
#   TEST2RRD="$TEST2RRD,temp"
# for its own temperature plugin. That maps the temp column to the RRD
# module "temp", which does not exist in xymond_rrd - if that entry is
# read first, this column gets NO rrd file at all. This file is read
# first as long as it keeps its name (my-... sorts before temp.cfg), so
# temp=ncv wins. If you do not use hobbit-plugins' temp plugin, empty
# its two temp.cfg drop-ins instead of relying on the order; if you do
# use it, the two cannot share the column - set TEMP_COLUMN on the
# clients of this extension and adjust GRAPHS_* accordingly.
TEST2RRD+=",temp=ncv"
SPLITNCV_temp="*:GAUGE"

# The graph is called "tempext", not "temp": hobbit-plugins' graphs.d
# defines a [temp] graph reading a dataset named "temp", and with two
# [temp] sections in graphs.cfg the file read last silently wins. A
# separate name keeps both definitions working - same reason the la
# extension uses [laext].
GRAPHS+=",tempext"
GRAPHS_temp="tempext"
