# xymonserver.cfg settings for the "temp" Xymon extension.
#
# NOT INSTALLED BY THE PACKAGES - copy it in by hand:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/temp.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/temp.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
#
# Why by hand: on Debian/Ubuntu the file name xymonserver.d/temp.cfg
# belongs to the hobbit-plugins package, which ships a temperature
# plugin of its own, and dpkg refuses to install two packages that
# claim the same path. The other extensions have no such clash and are
# installed normally by my-xymon-extensions-server.
#
# If hobbit-plugins is installed and you do NOT use its temp plugin (it
# ships DISABLED), overwrite its file with this one - see
# ../README.md, section "Coexisting with hobbit-plugins", also for what
# happens if you want to keep both.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# The number of sensors varies per host, so use split-NCV: one RRD file
# per sensor, named temp,<sensor>.rrd with a single dataset "lambda".
#
# CAVEAT: the first match in TEST2RRD wins - xymond builds a tree from
# the value and keeps the first entry per test name. If your stock
# TEST2RRD already contains a "temp" entry (some setups map it to the
# temperature module, hobbit-plugins maps it to a module that does not
# exist at all), appending here has no effect. Either fix that entry in
# xymonserver.cfg to read temp=ncv, or make this one win regardless of
# read order by replacing the line below with:
#   TEST2RRD="temp=ncv,$TEST2RRD"
TEST2RRD+=",temp=ncv"
SPLITNCV_temp="*:GAUGE"

# "temp" does not collide with Xymon's own stock [temperature] graph
# (different name, different handler). It does collide with the [temp]
# graph of hobbit-plugins - see ../README.md if you need both.
GRAPHS+=",temp"
GRAPHS_temp="temp"
