# Graph definition for the "temp" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# Keep the file name as it is: graphs.d is shared with other packages
# (hobbit-plugins ships a temp.cfg there), and dpkg refuses to install
# two packages that claim the same path.
#
# The RRD files are created by split-NCV from the extension's status
# message: one file per sensor, named temp,<sensor>.rrd with a single
# dataset called "lambda" - split-NCV always uses that name, regardless
# of the test name.
#
# The section is called [tempext], not [temp]: hobbit-plugins' own
# graphs.d/temp.cfg defines a [temp] graph with the same FNPATTERN but
# a dataset named "temp", and Xymon lets the definition parsed LAST win
# (load_gdefs pushes each section onto the head of the list, the lookup
# takes the first hit). Two [temp] sections would therefore fight over
# alphabetical file order; a separate name cannot. The matching
# GRAPHS_temp="tempext" is in the xymonserver.d drop-in.
#
# The FNPATTERN matches however many sensors a host has, and its
# capture group fills the legend (@RRDPARAM@) with the sensor name.

[tempext]
    FNPATTERN temp,(.*).rrd
    TITLE Temperature sensors
    YAXIS Celsius
    DEF:temp@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:temp@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:temp@RRDIDX@:LAST: \: %4.1lf (cur)
    GPRINT:temp@RRDIDX@:MAX: \: %4.1lf (max)
    GPRINT:temp@RRDIDX@:MIN: \: %4.1lf (min)
    GPRINT:temp@RRDIDX@:AVERAGE: \: %4.1lf (avg)\n
