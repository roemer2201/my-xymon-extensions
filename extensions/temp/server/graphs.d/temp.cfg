# Graph definition for the "temp" Xymon extension.
#
# NOT INSTALLED BY THE PACKAGES - copy it into the Xymon server's
# graphs.d directory by hand (Debian/Ubuntu: /etc/xymon/graphs.d/), or
# append its contents to graphs.cfg directly. See ../README.md.
#
# Why by hand: on Debian/Ubuntu the file name graphs.d/temp.cfg belongs
# to the hobbit-plugins package, and dpkg refuses to install two
# packages that claim the same path. hobbit-plugins defines a [temp]
# graph of its own there, reading a dataset named "temp" - split-NCV
# writes "lambda", so the two definitions are not interchangeable. If
# you do not use its temp plugin, overwrite its file with this one.
#
# Keeping BOTH is possible: rename the section below to [tempext] and
# set GRAPHS_temp="tempext" (plus GRAPHS+=",tempext") in the
# xymonserver.d drop-in. Without that the two [temp] sections fight
# over read order - Xymon lets the definition parsed LAST win, because
# load_gdefs pushes each section onto the head of the list and the
# lookup takes the first hit.
#
# The RRD files are created by split-NCV from the extension's status
# message: one file per sensor, named temp,<sensor>.rrd with a single
# dataset called "lambda" - split-NCV always uses that name, regardless
# of the test name.
#
# The FNPATTERN matches however many sensors a host has, and its
# capture group fills the legend (@RRDPARAM@) with the sensor name.

[temp]
    FNPATTERN temp,(.*).rrd
    TITLE Temperature sensors
    YAXIS Celsius
    DEF:temp@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:temp@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:temp@RRDIDX@:LAST: \: %4.1lf (cur)
    GPRINT:temp@RRDIDX@:MAX: \: %4.1lf (max)
    GPRINT:temp@RRDIDX@:MIN: \: %4.1lf (min)
    GPRINT:temp@RRDIDX@:AVERAGE: \: %4.1lf (avg)\n
