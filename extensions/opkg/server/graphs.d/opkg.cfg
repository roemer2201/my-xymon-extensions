# Graph definition for the "opkg" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# NCV creates one opkg.rrd per host with the datasets "updates" (all
# pending package updates) and "critical" (those matching the
# security-relevant patterns configured on the client).

[opkgupd]
    TITLE Pending package updates
    YAXIS Packages
    DEF:updates=opkg.rrd:updates:AVERAGE
    DEF:critical=opkg.rrd:critical:AVERAGE
    LINE2:updates#0000FF:updates available
    LINE2:critical#FF0000:security-relevant
    GPRINT:updates:LAST: %5.0lf (cur)
    GPRINT:updates:MAX: %5.0lf (max)\n
