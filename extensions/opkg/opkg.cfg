# opkg.cfg - configuration for the "opkg" Xymon extension
#
# This file is POSIX shell and is sourced by opkg.sh from
# $XYMONHOME/etc/opkg.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#OPKG_COLUMN="opkg"

# The opkg binary. Empty: found via "command -v opkg"; hosts without
# opkg report "clear".
#OPKG_BIN=""

# Whether the extension runs "opkg update" itself. On OpenWrt the
# downloaded package lists live in /tmp (a RAM disk) and are gone
# after every reboot, so "auto" refreshes them whenever they are
# missing or older than OPKG_MAXAGE hours. Set to "never" if a
# separate cron job keeps the lists current - the extension then only
# evaluates (and warns about missing/stale lists).
# Note: "opkg update" needs root (it writes the lists directory), so
# schedule the runner as root when using "auto".
#OPKG_UPDATE="auto"

# Package lists older than this many hours count as stale (and are
# refreshed when OPKG_UPDATE=auto). 0 disables the age check: lists
# only need to exist.
#OPKG_MAXAGE=24

# Space-separated shell glob patterns matched against the names of
# upgradable packages. A match turns the column red instead of yellow
# (opkg has no security-update classification like apt, so this list
# marks the security-relevant packages). Case-sensitive.
#OPKG_CRITICAL="dropbear* *openssl* *ssl* *tls* wpad* hostapd* dnsmasq* firewall* odhcpd* uhttpd* busybox* wireguard* curl* libcurl* wget*"

# opkg configuration file, parsed for the "lists_dir" option to find
# the package lists (rarely needs changing).
#OPKG_CONF="/etc/opkg.conf"

# Where the downloaded package lists live. Empty: the lists_dir
# option from OPKG_CONF, else /var/opkg-lists (OpenWrt default), else
# /var/lib/opkg/lists (upstream opkg default). Overridable mainly for
# the unit tests.
#OPKG_LISTSDIR=""

# Abort "opkg update" after this many seconds (only enforced when
# timeout(1) exists, which it does on BusyBox/coreutils/FreeBSD).
# 0 disables the limit.
#OPKG_TIMEOUT=300
