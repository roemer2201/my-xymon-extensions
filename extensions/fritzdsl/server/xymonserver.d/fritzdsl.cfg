# xymonserver.cfg settings for the "fritzdsl" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/fritzdsl.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/fritzdsl.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# One RRD file per variable, named fritzdsl,<name>.rrd, each with a
# single dataset "lambda" - split-NCV avoids NCV's 19-character and
# underscore limits on dataset names.
#
# The cumulative error counters are stored as DERIVE, so their graphs
# show error *rates*; everything else (rates, margins, attenuation,
# uptime) is a GAUGE.
TEST2RRD+=",fritzdsl=ncv"
SPLITNCV_fritzdsl="crc:DERIVE,fec:DERIVE,hec:DERIVE,es:DERIVE,ses:DERIVE,retrain:DERIVE,*:GAUGE"

# GRAPHS_fritzdsl is the list of graphs drawn on the fritzdsl status
# page, and it is the ONLY place these graphs appear: the trends page
# finds graphs by matching the graph name against the start of the RRD
# file name (lib/xymonrrd.c, find_xymon_graph()), and "fritzdslrate" is
# not a prefix of "fritzdsl,rateup.rrd" - only a graph named "fritzdsl"
# would be. So a graph missing from the list below is invisible,
# everywhere. Hence: list them all. Drop the ones you do not care about.
GRAPHS+=",fritzdslrate,fritzdslmargin,fritzdslatten,fritzdslerrors,fritzdslsecs,fritzdsluptime"
GRAPHS_fritzdsl="fritzdslrate,fritzdslmargin,fritzdslatten,fritzdslerrors,fritzdslsecs,fritzdsluptime"
