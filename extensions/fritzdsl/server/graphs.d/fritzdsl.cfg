# Graph definitions for the "fritzdsl" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per metric, named fritzdsl,<name>.rrd with a
# single dataset called "lambda". See server/README.md.

[fritzdslrate]
    FNPATTERN fritzdsl,((max)?rate_(down|up)).rrd
    TITLE DSL sync rate (FRITZ!Box)
    YAXIS kbit/s
    DEF:r@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:r@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:r@RRDIDX@:LAST: %8.0lf (cur)
    GPRINT:r@RRDIDX@:MIN: %8.0lf (min)\n

[fritzdslmargin]
    FNPATTERN fritzdsl,margin_(down|up).rrd
    TITLE DSL noise margin (FRITZ!Box)
    YAXIS dB
    DEF:m@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:m@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:m@RRDIDX@:LAST: %5.1lf (cur)
    GPRINT:m@RRDIDX@:MIN: %5.1lf (min)
    GPRINT:m@RRDIDX@:MAX: %5.1lf (max)\n

[fritzdslatten]
    FNPATTERN fritzdsl,atten_(down|up).rrd
    TITLE DSL line attenuation (FRITZ!Box)
    YAXIS dB
    DEF:a@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:a@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:a@RRDIDX@:LAST: %5.1lf (cur)
    GPRINT:a@RRDIDX@:MAX: %5.1lf (max)\n

# crc/fec/hec/retrain are DERIVE datasets: the graph shows the error
# rate per second.
[fritzdslerrors]
    FNPATTERN fritzdsl,(crc|fec|hec|retrain).rrd
    TITLE DSL line errors (FRITZ!Box)
    YAXIS Errors/second
    DEF:e@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:e@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:e@RRDIDX@:LAST: %8.2lf (cur)
    GPRINT:e@RRDIDX@:MAX: %8.2lf (max)\n

[fritzdslsecs]
    FNPATTERN fritzdsl,(es|ses).rrd
    TITLE DSL errored seconds (FRITZ!Box)
    YAXIS Errored s/s
    DEF:s@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:s@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:s@RRDIDX@:LAST: %8.4lf (cur)
    GPRINT:s@RRDIDX@:MAX: %8.4lf (max)\n

[fritzdsluptime]
    FNPATTERN fritzdsl,(uptime).rrd
    TITLE WAN connection uptime (FRITZ!Box)
    YAXIS Days
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    CDEF:ud@RRDIDX@=u@RRDIDX@,86400,/
    LINE2:ud@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:ud@RRDIDX@:LAST: %6.2lf (cur)
    GPRINT:ud@RRDIDX@:MAX: %6.2lf (max)\n
