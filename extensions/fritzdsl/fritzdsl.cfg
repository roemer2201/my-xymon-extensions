# fritzdsl.cfg - configuration for the "fritzdsl" Xymon extension
#
# This file is POSIX shell and is sourced by fritzdsl.sh from
# $XYMONHOME/etc/fritzdsl.cfg. The extension does nothing (and sends
# nothing) until FRITZ_USER and FRITZ_PASSWORD are set here.
#
# Values shown in the comments are the built-in defaults.

# ---------------------------------------------------------------------
# FRITZ!Box access.
#
# The box must have TR-064 enabled: Home Network > Network > Network
# Settings > "Allow access for applications" (German UI: Heimnetz >
# Netzwerk > Netzwerkeinstellungen > "Zugriff fuer Anwendungen
# zulassen"). Create a dedicated FRITZ!Box user (System > FRITZ!Box
# Users) with the "FRITZ!Box settings" permission for polling; on very
# old FRITZ!OS versions with password-only login the TR-064 user name
# is "dslf-config".
#
# Since this file contains a password, restrict its permissions
# (chmod 600) and ownership to the user running the Xymon client.
# The password is passed to curl on stdin, never on the command line.
# Note: a double quote (") in the password is not supported.
# ---------------------------------------------------------------------
#FRITZ_HOST="fritz.box"
#FRITZ_PORT="49000"
FRITZ_USER=""
FRITZ_PASSWORD=""

# Alternative to FRITZ_PASSWORD: read the password from a separate,
# tightly-permissioned file (first line, including its trailing
# newline stripped by the shell).
#FRITZ_PASSWORD_FILE="/etc/xymon/fritzdsl.secret"

# Xymon hostname the column is attached to. Must match the box's entry
# in the Xymon server's hosts.cfg. Default: FRITZ_HOST with dots
# replaced by commas (Xymon's hostname encoding), so with
# FRITZ_HOST="fritz.box" the reports go to the host "fritz.box".
# Set this explicitly when FRITZ_HOST is an IP address.
#REPORTHOST="fritzbox.example.org"

# Path to curl (default: first match in $PATH).
#CURL="/usr/bin/curl"

# Timeout in seconds per TR-064 request.
#TIMEOUT=15

# Where to read the WAN connection uptime (for resync detection and
# the uptime graph):
#   auto = try WANPPPConnection first, then WANIPConnection
#   ppp  = WANPPPConnection only (box dials in itself via PPPoE)
#   ip   = WANIPConnection only (box is an IP client behind a modem)
#   off  = skip the uptime check
#WAN_SERVICE="auto"

# ---------------------------------------------------------------------
# Thresholds. Setting a value to 0 disables that check.
# ---------------------------------------------------------------------
# Noise margin (SNR margin) in dB; below these values the column goes
# yellow/red. 6/3 dB is a conservative default - a healthy line
# usually syncs with a margin of 6 dB or more.
#MARGIN_WARN=6
#MARGIN_CRIT=3

# CRC errors per minute since the previous poll (the raw counters are
# cumulative; the rate is computed from the state of the last run).
#CRC_RATE_WARN=30
#CRC_RATE_CRIT=300
