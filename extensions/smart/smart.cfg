# smart.cfg - configuration for the "smart" Xymon extension
#
# This file is POSIX shell and is sourced by smart.sh from
# $XYMONHOME/etc/smart.cfg. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Path to smartctl (default: first match in $PATH).
#SMARTCTL="/usr/sbin/smartctl"

# Use sudo when the extension does not run as root:
#   auto = use "sudo -n smartctl" if permitted, otherwise report clear
#   yes  = always prefix smartctl with "sudo -n"
#   no   = never use sudo
# See sudoers.example for the required sudoers entry.
#USE_SUDO="auto"

# Do not wake up disks that are spun down ("smartctl -n standby").
# Disks in standby are skipped for that run and shown as clear.
#NOSPINUP="yes"

# Skip devices whose path matches this ERE (regular expression).
#EXCLUDE='^/dev/da[5-9]'

# ---------------------------------------------------------------------
# Thresholds. Setting a value to 0 disables that check.
# ---------------------------------------------------------------------
#TEMP_WARN=55       TEMP_CRIT=65       # degrees Celsius
#WEAR_WARN=80       WEAR_CRIT=90       # percent of rated SSD life used
#REALLOC_WARN=1     REALLOC_CRIT=50    # reallocated sectors
#PENDING_WARN=1     PENDING_CRIT=10    # current pending sectors
#UNCORR_WARN=1      UNCORR_CRIT=10     # offline uncorrectable sectors
#CRC_WARN=1         CRC_CRIT=100       # interface CRC errors (check cables!)
#MEDIAERR_WARN=1    MEDIAERR_CRIT=10   # NVMe media/data integrity errors
#SPARE_WARN=50      SPARE_CRIT=10      # NVMe available spare, percent LEFT

# ---------------------------------------------------------------------
# Devices.
#
# By default every device reported by "smartctl --scan" is checked.
# Declaring devices explicitly disables auto-discovery. Syntax:
#
#   device <path> [smartctl-options] [alias]
#
# The optional smartctl options are needed for USB bridges, RAID
# controllers etc. The optional alias is the name used in graphs
# (default: basename of the path); keep it lowercase alphanumeric.
# ---------------------------------------------------------------------
#device /dev/sda
#device /dev/sdb "-d sat"                    # SATA disk behind a USB bridge
#device /dev/sda "-d megaraid,0" "raid0d0"   # disk 0 on a MegaRAID controller

# ---------------------------------------------------------------------
# Attribute mapping overrides (vendor normalization).
#
# The built-in map in smart.sh converts SMART attributes to canonical
# metrics by matching the attribute *names* that smartmontools' drive
# database reports. If a drive misuses an attribute, override it here:
#
#   attrmap <model-glob> <attr-id-or-name-glob> <metric|none> [raw|norm|invnorm|gib|lba|mib32]
#
#   model-glob   shell glob matched against the model string
#                (Device Model / Model Number as printed by smartctl -i)
#   metric       one of: temp wear realloc pending uncorr crc mediaerr
#                spare hours cycles unsafeshut written read - or "none"
#                to ignore the attribute for this model
#   source       raw     = first number of the RAW_VALUE column (default)
#                norm    = normalized VALUE column
#                invnorm = 100 - VALUE ("percent life left" attributes)
#                gib     = RAW_VALUE already in GiB (written/read)
#                lba     = RAW_VALUE in 512-byte sectors, reported as GiB
#                mib32   = RAW_VALUE in 32-MiB units, reported as GiB
#
# User entries are checked before the built-in map; first match wins.
# ---------------------------------------------------------------------
# Example: a drive that reports garbage in 194 but real airflow temp in 190:
#attrmap "WDC WD40EFRX*" 194 none
# Example: an SSD whose attribute 233 is "percent life left" in VALUE:
#attrmap "SuperSSD 2000*" 233 wear invnorm
