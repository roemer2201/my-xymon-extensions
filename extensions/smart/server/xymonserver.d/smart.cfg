# xymonserver.cfg settings for the "smart" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/smart.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/smart.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# One RRD file per variable, named smart,<disk>_<metric>.rrd, each with
# a single dataset "lambda". Split-NCV (not plain NCV) is what allows an
# arbitrary, per-host varying number of disks.
TEST2RRD+=",smart=ncv"
SPLITNCV_smart="*:GAUGE"

# GRAPHS_smart is the list of graphs drawn on the smart status page, and
# it is the ONLY place these graphs appear: the trends page finds graphs
# by matching the graph name against the start of the RRD file name
# (lib/xymonrrd.c, find_xymon_graph()), and "smarttemp" is not a prefix
# of "smart,sda_temp.rrd" - only a graph named "smart" would be. So a
# graph that is missing from the list below is invisible, everywhere.
# Hence: list them all. Drop the ones you do not care about.
#
# Graphs whose RRD files do not exist on a host - "smartspare" on a box
# without NVMe, "smartrealloc" on a box with nothing but NVMe - are drawn
# as an empty frame (title and axes, no data), not as a broken image.
GRAPHS+=",smarttemp,smartwear,smartspare,smartrealloc,smartpending,smartuncorr,smartcrc,smartmediaerr,smarthours,smartwritten,smartread,smartdwpd,smartdwpdrecent"
GRAPHS_smart="smarttemp,smartwear,smartspare,smartrealloc,smartpending,smartuncorr,smartcrc,smartmediaerr,smarthours,smartwritten,smartread,smartdwpd,smartdwpdrecent"
