# Graph definitions for the "smart" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per disk and metric, named smart,<disk>_<metric>.rrd
# with a single dataset called "lambda". See server/README.md.

[smarttemp]
    FNPATTERN smart,(.+)_temp.rrd
    TITLE Disk temperature (SMART)
    YAXIS Celsius
    DEF:t@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:t@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:t@RRDIDX@:LAST: %3.0lf (cur)
    GPRINT:t@RRDIDX@:MAX: %3.0lf (max)
    GPRINT:t@RRDIDX@:MIN: %3.0lf (min)\n

