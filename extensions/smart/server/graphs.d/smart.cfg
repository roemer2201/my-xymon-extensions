# The two DWPD graphs need four axis options that the other blocks do
# without, because their values are small fractions - a lifetime DWPD of
# 0.0034 is normal. Without them rrdtool labels the y-axis "3.0 m" to
# "4.0 m" (milli) and autoscales to the data range, so a drift of three
# ten-thousandths fills the whole graph and looks alarming:
#
#   -X 0   fix the SI exponent at 0: plain decimals, no "m" prefix
#   -L 6   reserve 6 characters for the labels so "0.004" still fits
#   -l 0   anchor the axis at zero, so the height shows the true
#          magnitude - nowhere near one full drive write per day
#   -Y     alternative y-grid, which places sensible gridlines in the
#          resulting narrow range
#
# Note the short forms with a space: Xymon passes each line here to
# rrdtool as one argument, and a long option written "--units-exponent 0"
# is not parsed that way (it needs "--units-exponent=0").

[smartdwpd]
    FNPATTERN smart,(.+)_dwpd.rrd
    TITLE Disk writes per day, lifetime average (SMART)
    YAXIS Writes/day
    -X 0
    -L 6
    -l 0
    -Y
    DEF:d@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE1:d@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:d@RRDIDX@:LAST: %8.5lf (cur)
    GPRINT:d@RRDIDX@:MAX: %8.5lf (max)
    GPRINT:d@RRDIDX@:MIN: %8.5lf (min)\n

[smartdwpdrecent]
    FNPATTERN smart,(.+)_dwpdrecent.rrd
    TITLE Disk writes per day, recent window (SMART)
    YAXIS Writes/day
    -X 0
    -L 6
    -l 0
    -Y
    DEF:d@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE1:d@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:d@RRDIDX@:LAST: %8.5lf (cur)
    GPRINT:d@RRDIDX@:MAX: %8.5lf (max)
    GPRINT:d@RRDIDX@:MIN: %8.5lf (min)
    GPRINT:d@RRDIDX@:AVERAGE: %8.5lf (avg)\n
