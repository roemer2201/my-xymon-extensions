# claude.cfg - configuration for the "claude" (Claude Code login)
# Xymon extension. POSIX shell, sourced by claude.sh from
# $XYMONHOME/etc/my-xymon-extensions/claude.cfg; a value set here wins
# over the environment. The values shown are the built-in defaults.

# Xymon column name (lowercase, max ~8 characters, no dots).
#CLAUDE_COLUMN="claude"

# Accounts to check, space separated. Every account has its own login.
# One without a credentials file reports clear. Unless the client runs
# as root, each account other than its own needs a sudo rule for
# claude-expiry.sh (see sudoers.example).
#CLAUDE_ACCOUNTS="root"

# Days of login (refresh token) validity left.
#CLAUDE_WARN=10   # yellow at or below
#CLAUDE_CRIT=5    # red at or below

# The helper; empty means claude-expiry.sh next to claude.sh, else
# $XYMONHOME/ext.
#CLAUDE_HELPER=""

# "auto": sudo only when not root and not the client's own account;
# "yes": always "sudo -n"; "no": never.
#CLAUDE_SUDO="auto"
