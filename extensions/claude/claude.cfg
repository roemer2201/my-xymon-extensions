# claude.cfg - configuration for the "claude" (Claude Code login)
# Xymon extension
#
# This file is POSIX shell and is sourced by claude.sh from
# $XYMONHOME/etc/claude.cfg. Every setting can also be given as an
# environment variable of the same name; a value set in this file wins
# over the environment. All settings are optional; the values shown
# here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#CLAUDE_COLUMN="claude"

# Which accounts to check, space separated. Claude Code keeps its
# login per user in $HOME/.claude/.credentials.json, so every account
# that runs Claude - a service user, a build account, your own login -
# has a login of its own that expires on its own schedule.
#
# The default is the account Claude Code is usually installed for on a
# server. Every account listed here that has no credentials file is
# reported as "clear" (not logged in), not as an error.
#
# IMPORTANT: unless the Xymon client runs as root, every account other
# than the client's own needs a matching sudo rule for
# claude-expiry.sh - see sudoers.example, which ships with one line
# for "root" and shows how to add more accounts.
#CLAUDE_ACCOUNTS="root"

# Thresholds in DAYS of remaining validity of the login (the refresh
# token). The access token, which expires within hours and is renewed
# automatically, is reported as information only and never colors the
# column.
#CLAUDE_WARN=10   # yellow at or below this many days left
#CLAUDE_CRIT=5    # red at or below this many days left

# The privileged helper that reads the credentials file. Empty means
# claude-expiry.sh next to claude.sh, else $XYMONHOME/ext.
#CLAUDE_HELPER=""

# How the helper is called: "auto" uses sudo only when this script does
# not already run as root (and never for the client's own account),
# "yes" always uses "sudo -n", "no" never does. "no" is for hosts where
# the Xymon client itself runs as root or where the credentials file is
# readable for it.
#CLAUDE_SUDO="auto"
