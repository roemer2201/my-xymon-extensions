# ntfy-alert.cfg - configuration for the "ntfy-alert" Xymon alert script
#
# This file is POSIX shell and is sourced by ntfy-alert.sh from
# $XYMONHOME/etc/ntfy-alert.cfg. The script logs an error (and sends
# nothing) until NTFY_URL and a token are set here.
#
# Since this file contains an access token, restrict its permissions
# (chmod 600) and ownership to the user running the Xymon server.
# The token is passed to curl on stdin, never on the command line.
# Note: a double quote (") in the token is not supported.
#
# Values shown in the comments are the built-in defaults.

# ---------------------------------------------------------------------
# ntfy server access (required).
#
# NTFY_URL is the base URL of the ntfy server; the topic comes from
# alerts.cfg as the SCRIPT recipient and is appended to this URL.
# NTFY_TOKEN is an access token of a user that may publish to the
# topic(s) - create one with "ntfy token add" or in the web UI.
# ---------------------------------------------------------------------
NTFY_URL=""
NTFY_TOKEN=""

# Alternative to NTFY_TOKEN: read the token from a separate,
# tightly-permissioned file (first line; the trailing newline is
# stripped by the shell).
#NTFY_TOKEN_FILE="/etc/xymon/ntfy-alert.secret"

# Optional: URL of the Xymon svcstatus.sh CGI. When set, tapping the
# notification opens the status page of the alerting host/service
# ("?HOST=...&SERVICE=..." is appended automatically).
#NTFY_CLICKURL="https://xymon.example.org/xymon-cgi/svcstatus.sh"

# ntfy priority per alert type: min, low, default, high, max.
#NTFY_PRIO_RED="high"
#NTFY_PRIO_YELLOW="default"
#NTFY_PRIO_RECOVERED="low"

# Truncate the notification body to this many characters (the ntfy
# default message size limit is 4096 bytes).
#NTFY_MAXCHARS=3500

# Path to curl (default: first match in $PATH).
#CURL="/usr/bin/curl"

# Timeout in seconds for the whole publish request.
#TIMEOUT=15
