# fritzwan.cfg - configuration for the "fritzwan" Xymon extension
#
# This file is POSIX shell and is sourced by fritzwan.sh from
# $XYMONHOME/etc/fritzwan.cfg. The extension does nothing (and sends
# nothing) until it is configured: either set FRITZ_USER and
# FRITZ_PASSWORD (TR-064), or set MODE="igd" for login-free polling
# via UPnP status information.
#
# Values shown in the comments are the built-in defaults.

# ---------------------------------------------------------------------
# FRITZ!Box access.
#
# Counter source / polling mode:
#   auto  = link state via TR-064 (needs credentials); traffic
#           counters preferably from the UPnP/IGD endpoint (64-bit,
#           wrap-free), falling back to the TR-064 32-bit counters
#   igd   = everything via UPnP/IGD, no credentials needed; requires
#           "Transmit status information over UPnP" to be enabled
#           (Home Network > Network > Network Settings; German UI:
#           "Statusinformationen ueber UPnP uebertragen")
#   tr064 = TR-064 only (32-bit counters; wraps every 4 GiB - avoid
#           on fast lines)
#
# For TR-064 create a dedicated FRITZ!Box user (System > FRITZ!Box
# Users) with the "FRITZ!Box settings" permission, and enable TR-064
# ("Allow access for applications" in the same settings dialog).
# Since this file may contain a password, restrict its permissions
# (chmod 600). The password is passed to curl on stdin, never on the
# command line. Note: a double quote (") in the password is not
# supported.
# ---------------------------------------------------------------------
#MODE="auto"
#FRITZ_HOST="fritz.box"
#FRITZ_PORT="49000"
FRITZ_USER=""
FRITZ_PASSWORD=""

# Alternative to FRITZ_PASSWORD: read the password from a separate,
# tightly-permissioned file.
#FRITZ_PASSWORD_FILE="/etc/xymon/fritzwan.secret"

# Xymon host the column is attached to. Must match the box's entry in
# the Xymon server's hosts.cfg. Default: FRITZ_HOST with dots replaced
# by commas (Xymon's hostname encoding). Set this explicitly when
# FRITZ_HOST is an IP address.
#REPORTHOST="fritzbox.example.org"

# Path to curl (default: first match in $PATH).
#CURL="/usr/bin/curl"

# Timeout in seconds per request.
#TIMEOUT=15

# ---------------------------------------------------------------------
# Thresholds. Setting a value to 0 disables that check.
# ---------------------------------------------------------------------
# Link utilization in percent of the Layer-1 capacity (average since
# the previous poll). Disabled by default - high throughput is not
# necessarily a problem; enable when a saturated uplink should alert.
#UTIL_WARN=0
#UTIL_CRIT=0
