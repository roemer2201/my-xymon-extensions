# Graph definitions for the "fritzwan" Xymon extension.
#
# Include this file from the Xymon server's graphs.cfg, e.g.:
#   include /etc/xymon/graphs.d/graphs-fritzwan.cfg
# (or append its contents to graphs.cfg directly).
#
# The RRD files are created by split-NCV from the extension's data
# messages: one file per metric, named fritzwan,<name>.rrd with a
# single dataset called "lambda". See server/README.md.

# Throughput and link capacity in one graph: the capacity lines give
# the rates their scale.
[fritzwanbps]
    FNPATTERN fritzwan,((max)?bps_(down|up)).rrd
    TITLE WAN throughput (FRITZ!Box)
    YAXIS bit/s
    DEF:b@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:b@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:b@RRDIDX@:LAST: %9.0lf (cur)
    GPRINT:b@RRDIDX@:AVERAGE: %9.0lf (avg)
    GPRINT:b@RRDIDX@:MAX: %9.0lf (max)\n

[fritzwanutil]
    FNPATTERN fritzwan,util_(down|up).rrd
    TITLE WAN link utilization (FRITZ!Box)
    YAXIS Percent
    -u 100
    -l 0
    DEF:u@RRDIDX@=@RRDFN@:lambda:AVERAGE
    LINE2:u@RRDIDX@#@COLOR@:@RRDPARAM@
    GPRINT:u@RRDIDX@:LAST: %5.1lf%% (cur)
    GPRINT:u@RRDIDX@:AVERAGE: %5.1lf%% (avg)
    GPRINT:u@RRDIDX@:MAX: %5.1lf%% (max)\n
