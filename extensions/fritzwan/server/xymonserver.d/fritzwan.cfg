# xymonserver.cfg settings for the "fritzwan" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/fritzwan.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/fritzwan.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# All fritzwan metrics are plain gauges: the extension computes the
# throughput itself, so no COUNTER/DERIVE handling is needed. One RRD
# file per variable, named fritzwan,<name>.rrd.
TEST2RRD+=",fritzwan=ncv"
SPLITNCV_fritzwan="*:GAUGE"

# Graphs on the trends page, and the selection shown on the fritzwan
# status page itself.
GRAPHS+=",fritzwanbps,fritzwanutil"
GRAPHS_fritzwan="fritzwanbps,fritzwanutil"
