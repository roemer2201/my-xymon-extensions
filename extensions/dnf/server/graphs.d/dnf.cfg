# Graph definitions for the "dnf" Xymon extension.
#
# Drop this file into the Xymon server's graphs.d directory
# (Debian/Ubuntu: /etc/xymon/graphs.d/), or append its contents to
# graphs.cfg directly. See ../README.md.
#
# NCV creates one dnf.rrd per host with these datasets:
#   updates    packages with a pending update (all of them)
#   security   packages with a pending security update
#   critical, important, moderate, low, unknown
#              pending security advisories ("notices") per severity,
#              as "dnf updateinfo summary --updates --security"
#              counts them
#   cves       distinct CVEs the pending updates fix
#
# --units-exponent=0 keeps rrdtool from labelling a y-axis that peaks
# below 1 with SI prefixes ("500 m" instead of 0.5). It needs the "="
# form: Xymon passes each line to rrdtool as a single argument.

[dnfupd]
    TITLE Pending package updates
    YAXIS Packages
    --units-exponent=0
    --lower-limit=0
    DEF:updates=dnf.rrd:updates:AVERAGE
    DEF:security=dnf.rrd:security:AVERAGE
    LINE2:updates#0000FF:updates available
    GPRINT:updates:LAST: %5.0lf (cur)
    GPRINT:updates:MIN: %5.0lf (min)
    GPRINT:updates:MAX: %5.0lf (max)\n
    LINE2:security#FF0000:security updates
    GPRINT:security:LAST:  %5.0lf (cur)
    GPRINT:security:MIN: %5.0lf (min)
    GPRINT:security:MAX: %5.0lf (max)\n

[dnfsec]
    TITLE Pending security advisories by severity
    YAXIS Advisories
    --units-exponent=0
    --lower-limit=0
    DEF:critical=dnf.rrd:critical:AVERAGE
    DEF:important=dnf.rrd:important:AVERAGE
    DEF:moderate=dnf.rrd:moderate:AVERAGE
    DEF:low=dnf.rrd:low:AVERAGE
    DEF:unknown=dnf.rrd:unknown:AVERAGE
    DEF:cves=dnf.rrd:cves:AVERAGE
    AREA:critical#CC0000:critical
    GPRINT:critical:LAST:  %5.0lf (cur)
    GPRINT:critical:MIN: %5.0lf (min)
    GPRINT:critical:MAX: %5.0lf (max)\n
    STACK:important#FF8800:important
    GPRINT:important:LAST: %5.0lf (cur)
    GPRINT:important:MIN: %5.0lf (min)
    GPRINT:important:MAX: %5.0lf (max)\n
    STACK:moderate#FFCC00:moderate
    GPRINT:moderate:LAST:  %5.0lf (cur)
    GPRINT:moderate:MIN: %5.0lf (min)
    GPRINT:moderate:MAX: %5.0lf (max)\n
    STACK:low#66AA00:low
    GPRINT:low:LAST:       %5.0lf (cur)
    GPRINT:low:MIN: %5.0lf (min)
    GPRINT:low:MAX: %5.0lf (max)\n
    STACK:unknown#888888:unknown
    GPRINT:unknown:LAST:   %5.0lf (cur)
    GPRINT:unknown:MIN: %5.0lf (min)
    GPRINT:unknown:MAX: %5.0lf (max)\n
    COMMENT:  distinct CVEs fixed
    GPRINT:cves:LAST: %5.0lf (cur)
    GPRINT:cves:MIN: %5.0lf (min)
    GPRINT:cves:MAX: %5.0lf (max)\n
