# xymonserver.cfg settings for the "dnf" Xymon extension.
#
# Drop-in file for the Xymon server:
#   Debian/Ubuntu   /etc/xymon/xymonserver.d/dnf.cfg
#   other installs  $XYMONHOME/etc/xymonserver.d/dnf.cfg
# then restart the Xymon server. Installations whose xymonserver.cfg
# does not read that directory yet need one line at its END:
#   optional directory /etc/xymon/xymonserver.d
# See ../README.md for the details per platform.
#
# "+=" appends verbatim - hence the leading comma in every value below -
# and it needs the variable to exist already. That is why this file must
# be read AFTER the stock TEST2RRD/GRAPHS lines, i.e. the include or
# directory statement belongs at the end of xymonserver.cfg.

# Plain NCV: eight fixed metrics, so one dnf.rrd per host with eight
# datasets is enough - no split-NCV needed. The client sends all eight
# in every "data" message or none at all, because plain NCV creates
# the RRD file with the datasets of the first message it sees.
TEST2RRD+=",dnf=ncv"
NCV_dnf="updates:GAUGE,security:GAUGE,critical:GAUGE,important:GAUGE,moderate:GAUGE,low:GAUGE,unknown:GAUGE,cves:GAUGE"

GRAPHS+=",dnfupd,dnfsec"
GRAPHS_dnf="dnfupd,dnfsec"
