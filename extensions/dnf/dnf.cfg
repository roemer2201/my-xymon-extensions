# dnf.cfg - configuration for the "dnf" Xymon extension
#
# This file is POSIX shell and is sourced by dnf.sh from
# $XYMONHOME/etc/my-xymon-extensions/dnf.cfg. Every setting can also
# be given as an environment variable of the same name; a value set in
# this file wins over the environment. All settings are optional; the
# values shown here are the built-in defaults. Uncomment to change.

# Xymon column name (lowercase, max ~8 characters, no dots).
#DNF_COLUMN="dnf"

# The dnf binary. Empty: found via "command -v dnf"; hosts without dnf
# report "clear".
#DNF_BIN=""

# dnf's system cache. The extension calls dnf with -C (cache only):
# it reads the metadata root already downloaded and never downloads
# anything itself, so it needs neither network access nor a cache of
# its own. Root has to keep this cache current - on EL that is the job
# of dnf-makecache.timer ("systemctl is-enabled dnf-makecache.timer").
# Only change this if /etc/dnf/dnf.conf sets another cachedir.
#DNF_CACHEDIR="/var/cache/dnf"

# Cached repository metadata older than this many hours turns the
# column yellow: nobody refreshes it any more, so newer updates would
# go unnoticed. Keep it above the largest metadata_expire of your
# repositories (dnf's default is 48 hours; "dnf repolist -v" shows the
# value per repository as Repo-expire), otherwise a repository is
# reported shortly before dnf refreshes it. 0 disables the age check.
#DNF_MAXAGE=72

# Abort a single dnf call after this many seconds (only enforced when
# timeout(1) exists). 0 disables the limit.
#DNF_TIMEOUT=120

# How long the Xymon server keeps the status before the column turns
# purple, in minutes (30 is Xymon's own default). Only needs raising
# if you raise the INTERVAL of the task in clientlaunch.d/dnf.cfg
# beyond the shipped 5m - and then the graphs get gaps: Xymon's RRD
# files expect a value at least every 10 minutes.
#DNF_LIFETIME=30

# Colors. Each one may be red, yellow or green; green keeps the
# finding in the report without changing the column.
#
# Updates that fix no security advisory:
#DNF_UPDATES_COLOR="yellow"
#
# Security updates, by the severity dnf reports for their advisories
# ("dnf updateinfo list --updates --security"). "unknown" are security
# advisories without a severity, as EPEL publishes them.
#DNF_SEC_CRITICAL_COLOR="red"
#DNF_SEC_IMPORTANT_COLOR="red"
#DNF_SEC_MODERATE_COLOR="yellow"
#DNF_SEC_LOW_COLOR="yellow"
#DNF_SEC_UNKNOWN_COLOR="yellow"

# Reboot pending: dnf reports when the running kernel is older than an
# installed kernel that fixes a security issue. red, yellow or green
# as above, or "off" to leave the check out of the report altogether.
#DNF_REBOOT_COLOR="yellow"

# "yes" lists every CVE id below its package instead of only counting
# them. A host that is far behind easily has hundreds; the report is
# cut at 100000 bytes (the overview at its top always stays).
#DNF_SHOW_CVES="no"
