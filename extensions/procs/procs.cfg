# procs.cfg - configuration for the "procs" Xymon extension
#
# This file is POSIX shell and is sourced by procs.sh from
# $XYMONHOME/etc/my-xymon-extensions/procs.cfg. Every setting can also
# be given as an environment variable of the same name; a value set in
# this file wins over the environment. All settings are optional; the
# values shown here are the built-in defaults. Uncomment to change.
#
# NEVER enable this extension on a host with a full Xymon client: the
# client sends the process list itself, and the two would overwrite
# each other. It is meant for clientless hosts (standalone runner).

# Where the process rules are evaluated:
#   "server" - send the process list to the Xymon server as a client
#              message; the server checks it against the PROC rules of
#              its analysis.cfg and builds the "procs" column exactly
#              as for a full client (TRACK graphs included). Hosts
#              without PROC rules show "No process checks defined".
#              See README.md for the hosts.cfg tag NOCOLUMNS:msgs,files.
#   "local"  - check the rules in PROCS_RULES below on this host and
#              report the "procs" column as a normal status message.
#PROCS_MODE="server"

# Rules for PROCS_MODE="local", one per line, in the syntax of a PROC
# line in the server's analysis.cfg (without the PROC keyword):
#   NAME [MIN [MAX [COLOR]]] [min=N] [max=N] [color=C] [TEXT=label]
# NAME is a substring of the command line ("cron" finds
# /usr/sbin/crond), or "%REGEX" - a POSIX extended regular expression
# here, the server uses PCRE: no \d, \s, lazy quantifiers or
# lookarounds. Put NAME in double quotes when it contains blanks.
# Defaults: MIN 1, MAX unlimited, COLOR red. MAX 0 with a MIN > 0
# means unlimited; "MIN 0 MAX 0" requires that NAME does NOT run.
# Lines starting with "#" are ignored. Without rules the column is
# clear ("No process checks defined"), as on the server.
#PROCS_RULES='
#dnsmasq
#"%^/usr/sbin/hostapd" 1 1 red
#dropbear 1 0 yellow TEXT=sshd
#'

# Append the process list to the status in local mode (the server
# does so by default too).
#PROCS_PSLIST="yes"

# Column name for local mode and for the "clear" status sent when no
# process list can be collected. The server always names its column
# "procs".
#PROCS_COLUMN="procs"

# Client OS type and class sent in server mode. The OS type selects
# the server's client backend, which must match the ps format; it is
# derived from that format ("linux" or "freebsd") and rarely needs
# changing. The class is matched by CLASS= rules in analysis.cfg;
# empty means the OS type, like a full client without CLIENTCLASS.
#PROCS_OSTYPE=""
#PROCS_CLASS=""

# Which ps to expect. "auto" tries, on Linux, procps-ng with the full
# client's command (TurrisOS, regular distributions), then BusyBox
# with CONFIG_DESKTOP ("ps -o"), then BusyBox without it ("ps ww" -
# stock OpenWrt), and on FreeBSD the full client's FreeBSD command.
# A fixed value skips the other attempts: procps, busybox-desktop,
# busybox, freebsd.
#PROCS_PSFORMAT="auto"

# The ps command (rarely needs changing; overridable mainly for the
# unit tests).
#PROCS_PS="ps"
